        fastDesc: "<p>別の玉へ効率よく質量を流し込みたい時は Fast-Feed を使ってください。バインドを押したウィンドウだけが分裂します。メニューでは自動と手動の2方式を選べます（初期設定は手動です）。</p><p>自動 – ターゲット固定と Ping・距離補正付きの自動モード（2つのバインドを使用し、初期設定では両方とも E）：</p><ol><li>ターゲット固定（固定 / 解除）と実行（発動）：両方が同じキー（E）にある場合、狙う玉（味方、2つ目のウィンドウ、または現在の自分以外の玉）にカーソルを合わせて Freeze Mouse を押し、E を押すと対象が黄色く縁取られて中央から線が引かれ、即座に最初の5回分裂（32分割）を行います。</li><li>別キー割り当て（任意）：固定 / 解除と発動を別々のキーにすると、1つ目のキーで味方を固定・解除したまま、2つ目のキーでカーソルを合わせ直さずに何度でもフィードできます。</li><li>正確な2回目分裂タイミング：最初の分裂開始を検知し、小さい玉（最大玉の 15% 未満）を除外した上で、対象が分裂・合体してもロックを維持し、Ping と距離を計算して突入タイミングに合わせて次の5回分裂（32分割）を行います。</li><li>保護とタイムアウト：対象が遠すぎる場合は射程に入るまで待機し、3秒以内に届かない、対象が消える、または自分が死亡した場合は待機を解除して2回目の分裂を行いません。</li></ol>",
        fastManual: "<p>手動 – 指定した遅延時間を使う従来モード：</p><ol><li>目的の方向で Freeze Mouse を押し、Fast-Feed のバインドを押します。</li><li>5回分裂（32分割）し、スライダーで設定した時間（初期値 800ms）待ってからさらに5回分裂（32分割）します。</li></ol><p>補足：手動モードで大質量（~800k）の時は、早すぎる発動を防ぐため遅延スライダーを約 850ms まで上げてください。自動モードでも安定した固定とタイミングのために良好な Ping と安定した FPS が重要です。</p>"

      ko: {
        fastAutoLbl: "자동",
        fastManLbl: "수동",
        fastDesc: "<p>다른 셀에 효율적으로 매스를 몰아주고 싶다면 Fast-Feed를 사용하세요. 바인드를 누른 창만 분열합니다. 메뉴에서 자동과 수동 두 가지 방식을 선택할 수 있습니다(기본값은 수동입니다).</p><p>자동 – 대상 고정 및 핑/거리 보정이 적용된 자동 모드(두 개의 바인드를 사용하며 기본값은 모두 E):</p><ol><li>대상 고정(고정 / 해제) 및 시작(실행): 두 바인드가 같은 키(E)에 있다면 원하는 셀(팀원, 두 번째 창, 또는 현재 내 셀을 제외한 아무 셀)에 커서를 올리고 Freeze Mouse를 누른 뒤 E를 누르세요 – 대상에 노란 테두리와 중앙선이 표시되고 즉시 첫 5회 분열(32조각)을 실행합니다.</li><li>개별 바인드 설정(선택): 고정 / 해제와 실행을 서로 다른 키에 지정하면 첫 번째 키로 팀원 고정을 유지하거나 풀 수 있고, 두 번째 키로 매번 조준하지 않고도 반복해서 피드할 수 있습니다.</li><li>정확한 2차 분열 타이밍: 첫 분열 시작을 감지해 작은 조각(최대 셀 질량의 15% 미만)은 걸러내고, 대상이 분열하거나 합쳐져도 고정을 유지하며, 핑과 거리를 계산해 목표에 닿는 순간 두 번째 5회 분열(32조각)을 실행합니다.</li><li>보호 및 시간 제한: 대상이 너무 멀면 사거리 안에 들어올 때까지 대기하며, 3초 이내에 닿지 않거나 대상이 사라지거나 본인이 죽으면 대기가 취소되어 2차 분열이 나가지 않습니다.</li></ol>",
        fastManual: "<p>수동 – 지정된 지연 시간을 사용하는 기본 모드:</p><ol><li>원하는 방향에서 Freeze Mouse를 누른 뒤 Fast-Feed 바인드를 누르세요.</li><li>스크립트가 5번(32조각) 분열하고 슬라이더로 설정한 시간(기본 800ms)만큼 기다린 뒤 다시 5번(32조각) 분열합니다.</li></ol><p>참고: 수동 모드에서 매스가 클 때(~800k)는 분열이 너무 빨리 터지지 않도록 딜레이 슬라이더를 약 850ms로 높여 주세요. 자동 모드에서도 안정적인 고정과 정확한 타이밍을 위해 좋은 핑과 일정한 FPS가 중요합니다.</p>"

        fastAutoLbl: "Otomatis",
        fastManLbl: "Manual",
        fastDesc: "<p>Ingin menyalurkan massa secara efektif ke sel lain? Gunakan Fast-Feed. Hanya jendela tempat bind ditekan yang akan membelah. Di menu tersedia dua metode: Otomatis dan Manual (default-nya Manual).</p><p>Otomatis – mode otomatis dengan kunci target serta kompensasi ping dan jarak (menggunakan dua bind, keduanya default di tombol E):</p><ol><li>Kunci target (Kunci / Buka) dan mulai (Aktifkan): jika kedua bind berada di tombol yang sama (E), arahkan kursor ke sel tujuan (rekan setim, jendela kedua Anda, atau sel mana pun selain sel Anda saat ini), tekan Freeze Mouse, lalu tekan E – target akan mendapat garis tepi kuning beserta garis dari tengah layar, dan script langsung melakukan 5 split pertama (32 bagian).</li><li>Bind terpisah (opsional): jika Kunci / Buka dan Aktifkan dipasang di tombol berbeda, tombol pertama dapat dipakai untuk menahan atau melepas kunci pada rekan setim, dan tombol kedua untuk memberi makan berulang kali tanpa mengarahkan kursor lagi ke target.</li><li>Waktu split ke-2 yang presisi: script melacak awal pembelahan pertama, mengabaikan pecahan kecil Anda (&lt; 15% dari sel terbesar), mempertahankan kunci jika target membelah atau menyatu, memperhitungkan ping dan jarak, lalu menekan 5 split kedua (32 bagian) tepat saat masuk ke target.</li><li>Perlindungan dan batas waktu: jika target terlalu jauh, script menunggu hingga masuk jangkauan; jika dalam 3 detik belum mendekat, target hilang, atau Anda mati – penantian dibatalkan dan split kedua tidak dijalankan.</li></ol>",
        fastManual: "<p>Manual – mode klasik dengan jeda tetap:</p><ol><li>Tekan Freeze Mouse ke arah yang diinginkan lalu tekan bind Fast-Feed.</li><li>Script membelah 5 kali (32 bagian), menunggu waktu yang diatur di slider (default 800ms), lalu membelah 5 kali lagi (32 bagian).</li></ol><p>Catatan: Di mode Manual saat massa besar (~800k), naikkan slider delay ke sekitar 850ms agar pembelahan tidak terpicu terlalu cepat. Di mode Otomatis, ping yang baik dan FPS stabil tetap penting untuk penguncian dan ketepatan waktu.</p>"
      },
      vi: {
        fastAutoLbl: "Tự động",
        fastManLbl: "Thủ công",
        fastDesc: "<p>Muốn dồn khối lượng hiệu quả sang một bóng khác? Hãy dùng Fast-Feed. Chỉ cửa sổ nơi bạn bấm bind mới thực hiện tách. Trong menu có hai phương thức: Tự động và Thủ công (mặc định là Thủ công).</p><p>Tự động – chế độ tự động khóa mục tiêu kèm bù ping và khoảng cách (dùng hai bind, mặc định đều là phím E):</p><ol><li>Khóa mục tiêu (Khóa / Mở khóa) và chạy (Kích hoạt): nếu cả hai bind đặt chung một phím (E), đưa con trỏ vào bóng mục tiêu (đồng đội, cửa sổ thứ hai hoặc bất kỳ bóng nào ngoài bóng hiện tại của bạn), bấm Freeze Mouse rồi bấm E – mục tiêu sẽ có viền vàng kèm đường nối từ tâm màn hình, và script lập tức tách 5 lần đầu (32 mảnh).</li><li>Bind tách biệt (tùy chọn): nếu đặt Khóa / Mở khóa và Kích hoạt ở hai phím khác nhau, phím đầu dùng để giữ hoặc hủy khóa trên đồng đội, còn phím sau để bơm khối lượng liên tục mà không cần rê chuột lại vào mục tiêu.</li><li>Thời điểm tách lần 2 chuẩn xác: script theo dõi lúc bắt đầu tách lần 1, bỏ qua các mảnh nhỏ (&lt; 15% bóng lớn nhất), giữ khóa ngay cả khi mục tiêu tách hoặc nhập lại, tính toán ping và khoảng cách để bấm 5 lần tách tiếp theo (32 mảnh) đúng lúc lao vào mục tiêu.</li><li>Bảo vệ và ngắt: nếu mục tiêu quá xa, script sẽ chờ tới tầm; nếu sau 3 giây vẫn chưa vào tầm, mục tiêu biến mất hoặc bạn chết – chờ sẽ hủy và lần tách thứ hai không kích hoạt.</li></ol>",
        fastManual: "<p>Thủ công – chế độ cổ điển theo độ trễ cố định:</p><ol><li>Nhấn Freeze Mouse theo hướng mong muốn rồi bấm bind Fast-Feed.</li><li>Script tách 5 lần (32 mảnh), chờ đúng thời gian đặt trên thanh trượt (mặc định 800ms) rồi tách tiếp 5 lần (32 mảnh).</li></ol><p>Lưu ý: Ở chế độ Thủ công khi khối lượng lớn (~800k), hãy tăng thanh độ trễ lên khoảng 850ms để bóng không tách quá sớm. Ở chế độ Tự động, ping tốt và FPS ổn định vẫn rất quan trọng để khóa và canh thời điểm chuẩn xác.</p>"
      },
      th: {
        fastAutoLbl: "อัตโนมัติ",
        fastManLbl: "กำหนดเอง",
        fastDesc: "<p>อยากส่งมวลเข้าอีกลูกอย่างมีประสิทธิภาพใช่ไหม? ใช้ Fast-Feed เลย เฉพาะหน้าต่างที่กดปุ่มเท่านั้นที่จะแตกตัว ในเมนูมีให้เลือก 2 วิธีคือ อัตโนมัติ และ กำหนดเอง (ค่าเริ่มต้นคือ กำหนดเอง)</p><p>อัตโนมัติ – โหมดอัตโนมัติพร้อมล็อกเป้าหมายและชดเชยค่า Ping กับระยะทาง (ใช้ 2 ปุ่ม โดยค่าเริ่มต้นตั้งไว้ที่ปุ่ม E ทั้งคู่):</p><ol><li>ล็อกเป้าหมาย (ล็อก / ปลดล็อก) และเริ่มใช้งาน (เปิดใช้งาน): หากทั้งสองปุ่มอยู่ที่ปุ่มเดียวกัน (E) ให้เลื่อนเคอร์เซอร์ไปที่ลูกเป้าหมาย (เพื่อนร่วมทีม หน้าต่างที่สองของคุณ หรือลูกใดก็ได้ที่ไม่ใช่ลูกปัจจุบันของคุณ) กด Freeze Mouse แล้วกด E – เป้าหมายจะมีขอบสีเหลืองพร้อมเส้นจากกลางจอ และสคริปต์จะแตกตัว 5 ครั้งแรก (32 ชิ้น) ทันที</li><li>แยกปุ่ม (ไม่บังคับ): หากตั้งปุ่ม ล็อก / ปลดล็อก และ เปิดใช้งาน แยกกัน คุณสามารถใช้ปุ่มแรกค้างหรือปลดล็อกเพื่อนร่วมทีมไว้ล่วงหน้า แล้วใช้ปุ่มที่สองส่งมวลซ้ำได้โดยไม่ต้องเล็งเคอร์เซอร์กลับไปที่เป้าหมาย</li><li>จังหวะแตกตัวครั้งที่ 2 แม่นยำ: สคริปต์จะจับจังหวะเริ่มแตกตัวครั้งแรก คัดลูกเล็กของคุณออก (&lt; 15% ของลูกใหญ่สุด) คงการล็อกไว้แม้เป้าหมายจะแตกหรือรวมตัว และคำนวณ Ping กับระยะเพื่อกดแตกตัวอีก 5 ครั้ง (32 ชิ้น) ให้ตรงจังหวะพุ่งเข้าเป้าหมาย</li><li>ระบบป้องกันและตัดรอบ: หากเป้าหมายอยู่ไกลเกินไป สคริปต์จะรอจนเข้าใกล้ระยะ แต่ถ้าเกิน 3 วินาทียังไม่เข้าใกล้ เป้าหมายหายไป หรือคุณตาย – ระบบจะยกเลิกและไม่กดแตกตัวครั้งที่สอง</li></ol>",
        fastManual: "<p>กำหนดเอง – โหมดดั้งเดิมที่ใช้เวลาหน่วงคงที่:</p><ol><li>กด Freeze Mouse ไปทิศทางที่ต้องการแล้วกดปุ่ม Fast-Feed</li><li>สคริปต์จะแตกตัว 5 ครั้ง (32 ชิ้น) รอตามเวลาที่ตั้งบนแถบเลื่อน (ค่าเริ่มต้น 800ms) แล้วแตกตัวอีก 5 ครั้ง (32 ชิ้น)</li></ol><p>หมายเหตุ: ในโหมดกำหนดเองเมื่อมวลเยอะ (~800k) ให้เพิ่มตัวเลื่อนดีเลย์ไปประมาณ 850ms เพื่อไม่ให้แตกตัวเร็วเกินไป ส่วนในโหมดอัตโนมัติ Ping ที่ดีและ FPS ที่นิ่งยังคงสำคัญต่อการล็อกและความแม่นยำของจังหวะ</p>"
      }
    };
    for (const k in k9FastTr) {
      if (d4PxN[k]) {
        Object.assign(d4PxN[k], k9FastTr[k]);
        d4PxN[k].autoDesc = d4PxN[k].autoDesc.replace(/<strong>([\s\S]*?)<\/strong>/g, "$1");
      }
    }

    const s2VnK = k8LmQ.getElementById("lang-select");
    const a7RmT = k8LmQ.getElementById("alert-box");
    const q1WxP = k8LmQ.getElementById("t-solo-title");
    const w3ZnL = k8LmQ.getElementById("t-solo-desc");
    const e5KpM = k8LmQ.getElementById("t-fast-title");
    const r9TvB = k8LmQ.getElementById("t-fast-desc");
    const r9TvM = k8LmQ.getElementById("t-fast-manual");
    const l9FaA = k8LmQ.getElementById("t-fast-auto-lbl");
    const l9FaM = k8LmQ.getElementById("t-fast-man-lbl");

    const y4HuN = k8LmQ.getElementById("t-auto-desc");

    const m6QcL = k8LmQ.getElementById("t-code-link");
    const v8JsM = Object.keys(d4PxN);

    function c6FgW(lang) {
      const code = v8JsM.indexOf(lang) !== -1 ? lang : "en";
      const d = d4PxN[code];
      k8LmQ.documentElement.lang = code;
      k8LmQ.documentElement.dir = code === "ar" ? "rtl" : "ltr";
      a7RmT.innerHTML = d.alert;
      q1WxP.textContent = d.soloTitle;
      w3ZnL.innerHTML = d.soloDesc;
      e5KpM.textContent = d.fastTitle;
      r9TvB.innerHTML = d.fastDesc;

      if (l9FaA) l9FaA.textContent = d.fastAutoLbl;
      if (l9FaM) l9FaM.textContent = d.fastManLbl;

        if (k3PxN) k3PxN.innerHTML = d.autoDesc.slice(pIdx);
      } else {
        y4HuN.innerHTML = d.autoDesc;
        if (k3PxN) k3PxN.innerHTML = "";
      }
      if (m6QcL) m6QcL.textContent = d.codeLink;
      s2VnK.value = code;
      k8LmQ.querySelectorAll(".vid-empty").forEach(el => {
        el.textContent = d.noVideo + " (" + el.getAttribute("data-file") + ")";
      });
    }

    const n3LpQ = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().slice(0, 2);
    let p7XrZ = null;
    try { p7XrZ = localStorage.getItem("mbx_user_lang"); } catch (_) {}
    if (!p7XrZ || v8JsM.indexOf(p7XrZ) === -1) {
      p7XrZ = v8JsM.indexOf(n3LpQ) !== -1 ? n3LpQ : "en";
    }
    c6FgW(p7XrZ);

    s2VnK.addEventListener("change", function () {
      const v = this.value;

      c6FgW(v);

    ["solo-video", "fast-feed-auto-video", "fast-feed-video", "auto-rev-ws-video", "auto-rev-video"].forEach(id => {

    });
  })(document);
