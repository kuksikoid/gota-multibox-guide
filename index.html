<head>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0d0d0d;color:#d0d0d0;font-family:'Ubuntu',Arial,sans-serif;min-height:100vh;line-height:1.58;font-size:14px}
    header{position:sticky;top:0;z-index:50;background:#121212;border-bottom:1px solid #242424}
    .top-bar{max-width:1160px;margin:0 auto;padding:11px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .logo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
    .logo-main{font-size:17px;font-weight:700;color:#efefef;letter-spacing:0.2px}
    .logo-main span{color:#3898ec}
    .logo-ver{font-size:12px;color:#777;font-weight:500}
    .lang-select{background:#191919;border:1px solid #303030;color:#e4e4e4;font-family:inherit;font-size:13px;font-weight:500;padding:6px 10px;border-radius:4px;outline:none;cursor:pointer;max-width:210px}
    .lang-select:hover,.lang-select:focus{border-color:#505050}
    .lang-select option{background:#161616;color:#e4e4e4}
    main{max-width:1160px;margin:0 auto;padding:20px 20px 56px}
    .notice{background:#181212;border:1px solid #2d1d1d;border-inline-start:3px solid #d13838;color:#c9b4b4;font-size:13.5px;padding:11px 15px;border-radius:4px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
    .notice b{color:#ff6b6b}
    .notice-text{flex:1 1 260px;min-width:0}
    .notice-link{display:inline-flex;align-items:center;gap:7px;background:#131c26;border:1px solid #233b54;color:#3898ec;font-size:13px;font-weight:700;line-height:1.25;padding:5px 11px;border-radius:4px;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:background 0.15s,border-color 0.15s,color 0.15s}
    .notice-link:hover,.notice-link:focus-visible{background:#192736;border-color:#3898ec;color:#62b2f5;outline:none}
    .notice-link svg{width:14px;height:14px;fill:currentColor;flex-shrink:0;display:block}
    .list{display:flex;flex-direction:column;gap:14px}
    .item{background:#141414;border:1px solid #242424;border-radius:5px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:22px;align-items:start}
    .item-head{font-size:16px;font-weight:700;color:#fff;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid #222}
    .item-body{font-size:13.5px;color:#c8c8c8;overflow-wrap:break-word}
    .item-body p{margin-bottom:10px}
    .item-body ol{margin:6px 0 12px;padding-inline-start:20px}
    .item-body li{margin-bottom:5px}
    .item-body p:last-child,.item-body ol:last-child,.item-body li:last-child{margin-bottom:0}
    .item-body .auto-rev-glow{color:#fff}
    .media-wrap{width:100%;aspect-ratio:16/9;background:#070707;border:1px solid #262626;border-radius:4px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
    .media-wrap video{width:100%;height:100%;object-fit:contain;outline:none;display:block}
    .item.item-auto{display:block}
    .auto-head-grid,.auto-row{display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:22px;align-items:start}
    .auto-row+.auto-row{margin-top:12px}
    .fast-text-col{display:flex;flex-direction:column;gap:10px;min-width:0}
    .media-stack{display:flex;flex-direction:column;gap:14px;min-width:0}
    .media-slot{display:flex;flex-direction:column;gap:5px}
    .media-label{font-size:12px;font-weight:700;color:#9aa0a6;letter-spacing:0.3px}
    .vid-empty{display:none;color:#666;font-size:12.5px;text-align:center;padding:14px;user-select:none}
    @media(max-width:940px){
      .item{grid-template-columns:1fr;gap:16px;padding:16px}
      .auto-head-grid,.auto-row{grid-template-columns:1fr;gap:14px}
    }
  </style>
</head>

</main>

<script>
  (function (k8LmQ) {
    const d4PxN = {
      en: {
        alert: "This script will not work in any Russian browser.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>This feature is made mainly for multiboxing with one big cell and one small cell. On the big cell, point your cursor toward the trick direction and PRESS (toggle) Freeze Mouse (or Line + Freeze Mouse). Do not hold it down, just press it, otherwise the big cell will split the other way.</p><p>Then switch to the small cell window and press the bind that fits the small cell's current mass. For example, at ~30k mass press key 7 (it is set by default, you can rebind it) (Trick 128). The small cell will instantly split 7 times (into 128 pieces) toward your cursor. At the same time, the big cell in the background will do 5 splits (32 pieces) along the frozen line, wait for the set time (Solo Delay - 800ms by default), and split another 5 times (32 pieces).</p><p>Right after pressing the bind, all you have to do is hold your normal in-game feed key so you successfully feed up for the Solo Trick. This gives you a clean solo-trick without switching tabs manually.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Want to efficiently dump mass into another cell? Use Fast-Feed. Press Freeze Mouse in the needed direction and press the Fast-Feed bind. Only the window where the bind was pressed will split.</p><p>The script does 5 splits (32 pieces), waits for the set time, and does another 5 splits (32 pieces). P.S. At heavy mass (~800k), raise the delay slider to around 850ms so the split does not trigger too early.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Previously, we thought the game was too heavily protected, so Auto-Rev only worked through screen image analysis. It turned out that is not the case, and now two methods are available in the menu: <strong>WebSocket</strong> and <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – works directly through server data:</p><ol><li><strong>Ignores you and your teammates:</strong> when locking a target, the script filters out your own cells and your party members. You will not lock onto yourself or a teammate, even if a teammate is overlapping the enemy under your cursor.</li><li><strong>No settings changes required:</strong> works seamlessly with skins, mass display, and enemy nicknames enabled. Overlapping cells, camera movement, and zooming do not interfere with it (as long as the target stays within the <strong>SERVER</strong>'s visibility range).</li><li><strong>Instant reaction with no false triggers:</strong> Auto-Rev triggers the moment the server packet confirms the locked player split. When you die, the target dies, or the match resets, the lock is automatically cleared. Good ping and FPS are still required for consistent performance.</li></ol><p><strong>Pixi (backup visual method)</strong> – the legacy method that reads the image from the screen. It is kept in case a game update temporarily breaks WebSocket reading. Its requirements are stricter – you need consistently good FPS and ping, and also:</p><ol><li>The target must be fully visible: not covered by other cells or screen edges.</li><li>You <strong class='auto-rev-glow'>MUST</strong> turn off skins, mass display, and enemy nicknames in the game settings, otherwise false triggers will occur.</li><li>Your camera must stay still; do not zoom while locked.</li><li>This method has a ~10ms delay, but it does not depend on the game's internal code and will keep working after any updates.</li></ol><p><strong>Note:</strong> Setting more than two splits (4 pieces / 2x) is not recommended, as you simply will not reach the target in time due to the game's own physics.</p>",
        noVideo: "Video unavailable",
        codeLink: "Latest code"
      },
      ru: {
        alert: "Этот скрипт не будет работать ни в одном российском браузере.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Функция сделана в основном для игры с мультом: один большой и мелкий шары. На большом шаре наведите курсор в сторону трика и НАЖМИТЕ (toggle) Freeze Mouse (или Line + Freeze Mouse). Не зажать, а именно нажать, иначе большой шар разделится в другую сторону.</p><p>Затем перейдите в окно, где мелкий шар, нажмите бинд под текущую массу мелкого шара. Например, при массе ~30k жмите клавишу 7 (по умолчанию стоит она, можете перебиндить) (Trick 128). Мелкий шар мгновенно разделится 7 раз (на 128 частей) в сторону курсора. Одновременно большой шар в фоне сделает 5 сплитов (32 части) по замороженной линии, подождет заданное время (Solo Delay - по умолчанию 800ms) и разделится еще 5 раз (32 части).</p><p>Сразу после нажатия бинда вам остается только зажать обычную клавишу кормления из самой игры, чтобы вы успешно откормились для Solo Trick'а. Это дает чистый соло-трик без ручного переключения вкладок.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Хотите эффективно влить массу в другой шар? Используйте Fast-Feed. Нажмите Freeze Mouse в нужном направлении и нажмите бинд Fast-Feed'а. Делится только то окно, с которого нажат бинд.</p><p>Скрипт делает 5 сплитов (32 части), ждет заданное время и делает еще 5 сплитов (32 части). P.S. При большой массе (~800k) увеличьте ползунок задержки примерно до 850ms, чтобы деление не сработало слишком рано.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Раньше мы думали, что игра слишком сильно защищена, поэтому авто-рев работал только через анализ картинки. Но оказалось, что это не так, и теперь в меню доступны два метода работы: <strong>WebSocket</strong> и <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – работает напрямую через данные сервера:</p><ol><li><strong>Не реагирует на вас и тиммейтов:</strong> при захвате цели скрипт отсеивает ваши шары и участников вашей пати. Вы не залочите себя или сокомандника, даже если тиммейт перекрывает врага под курсором.</li><li><strong>Не требует менять настройки:</strong> спокойно работает с включёнными скинами, показом массы и никами врагов. Ему не мешают перекрытия другими шарами, движение камеры и зум (главное, чтобы цель оставалась в зоне видимости <strong>СЕРВЕРА</strong>).</li><li><strong>Мгновенная реакция без ложных срабатываний:</strong> рев срабатывает сразу в момент получения пакета от сервера о том, что захваченный игрок разделился. При вашей смерти, смерти цели или сбросе матча захват снимается автоматически. Для стабильной работы всё так же нужны нормальные пинг и FPS.</li></ol><p><strong>Pixi (запасной визуальный способ)</strong> – старый способ, который считывает картинку с экрана. Нужен на случай, если какое-то обновление игры временно сломает чтение WebSocket. Здесь условия чуть построже – нужны стабильно хорошие FPS и пинг, а также:</p><ol><li>Цель должна быть полностью видна: не закрыта другими шарами или краями экрана.</li><li>Вы <strong class='auto-rev-glow'>ОБЯЗАНЫ</strong> выключить скины, массу и ники врагов в настройках игры, иначе будут ложные срабатывания.</li><li>Камера должна быть неподвижной, не зумите во время лока.</li><li>У этого метода есть задержка ~10ms, но он не зависит от внутреннего кода игры и продолжит работать после любых обновлений.</li></ol><p><strong>Примечание:</strong> Больше двух сплитов (4 части / 2x) ставить не рекомендуется, так как вы просто не успеете долететь до цели по физике самой игры.</p>",
        noVideo: "Видео недоступно",
        codeLink: "Актуальный код"
      },
      uk: {
        alert: "Цей скрипт не працюватиме в жодному російському браузері.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Функція зроблена здебільшого для гри з мультом: одна велика й одна дрібна кулі. На великій кулі наведіть курсор у бік трюку і НАТИСНІТЬ (toggle) Freeze Mouse (або Line + Freeze Mouse). Не затиснути, а саме натиснути, інакше велика куля розділиться в інший бік.</p><p>Потім перейдіть у вікно з дрібною кулею і натисніть бінд під її поточну масу. Наприклад, при масі ~30k тисніть клавішу 7 (вона стоїть за замовчуванням, можете перебіндити) (Trick 128). Дрібна куля миттєво розділиться 7 разів (на 128 частин) у бік курсора. Одночасно велика куля у фоні зробить 5 сплітів (32 частини) по замороженій лінії, зачекає заданий час (Solo Delay - за замовчуванням 800ms) і розділиться ще 5 разів (32 частини).</p><p>Одразу після натискання бінда вам залишається лише затиснути звичайну клавішу годування з самої гри, щоб ви успішно відгодувалися для Solo Trick'а. Це дає чистий соло-трюк без ручного перемикання вкладок.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Хочете ефективно влити масу в іншу кулю? Використовуйте Fast-Feed. Натисніть Freeze Mouse у потрібному напрямку та натисніть бінд Fast-Feed'а. Ділиться лише те вікно, з якого натиснуто бінд.</p><p>Скрипт робить 5 сплітів (32 частини), чекає заданий час і робить ще 5 сплітів (32 частини). P.S. При великій масі (~800k) збільште повзунок затримки приблизно до 850ms, щоб поділ не спрацював занадто рано.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Раніше ми думали, що гра надто сильно захищена, тому авто-рев працював лише через аналіз картинки. Але виявилося, що це не так, і тепер у меню доступні два методи роботи: <strong>WebSocket</strong> та <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – працює напряму через дані сервера:</p><ol><li><strong>Не реагує на вас і тіммейтів:</strong> під час захоплення цілі скрипт відсіює ваші кулі та учасників вашої паті. Ви не залочите себе чи сокомандника, навіть якщо тіммейт перекриває ворога під курсором.</li><li><strong>Не потребує зміни налаштувань:</strong> спокійно працює з увімкненими скінами, показом маси та ніками ворогів. Йому не заважають перекриття іншими кулями, рух камери та зум (головне, щоб ціль залишалася в зоні видимості <strong>СЕРВЕРА</strong>).</li><li><strong>Миттєва реакція без хибних спрацьовувань:</strong> рев спрацьовує одразу в момент отримання пакета від сервера про те, що захоплений гравець розділився. Після вашої смерті, смерті цілі або скидання матчу захоплення знімається автоматично. Для стабільної роботи так само потрібні нормальні пінг і FPS.</li></ol><p><strong>Pixi (запасний візуальний спосіб)</strong> – старий спосіб, який зчитує картинку з екрана. Потрібен на випадок, якщо якесь оновлення гри тимчасово зламає читання WebSocket. Тут умови трохи суворіші – потрібні стабільно хороші FPS і пінг, а також:</p><ol><li>Ціль має бути повністю видимою: не закритою іншими кулями чи краями екрана.</li><li>Ви <strong class='auto-rev-glow'>ЗОБОВ'ЯЗАНІ</strong> вимкнути скіни, масу та ніки ворогів у налаштуваннях гри, інакше будуть хибні спрацьовування.</li><li>Камера повинна бути нерухомою, не зуміть під час локу.</li><li>У цього методу є затримка ~10ms, але він не залежить від внутрішнього коду гри й продовжить працювати після будь-яких оновлень.</li></ol><p><strong>Примітка:</strong> Більше двох сплітів (4 частини / 2x) ставити не рекомендується, оскільки ви просто не встигнете долетіти до цілі за фізикою самої гри.</p>",
        noVideo: "Відео недоступне",

      },
      es: {
        alert: "Este script no funcionará en ningún navegador ruso.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Esta función está hecha principalmente para jugar con multibox: una célula grande y una pequeña. En la célula grande, apunta el cursor hacia el lado del truco y PULSA (toggle) Freeze Mouse (o Line + Freeze Mouse). No lo mantengas pulsado, solo púlsalo, o la célula grande se dividirá hacia otro lado.</p><p>Luego pasa a la ventana de la célula pequeña y pulsa el bind según su masa actual. Por ejemplo, con ~30k de masa pulsa la tecla 7 (viene por defecto, puedes cambiarla) (Trick 128). La pequeña se dividirá 7 veces al instante (128 partes) hacia el cursor. Al mismo tiempo, la grande en segundo plano hará 5 splits (32 partes) por la línea congelada, esperará el tiempo configurado (Solo Delay - 800ms por defecto) y volverá a dividirse 5 veces (32 partes).</p><p>Justo después de pulsar el bind, solo tienes que mantener tu tecla normal de feed del juego para alimentarte bien para el Solo Trick. Esto da un solo-trick limpio sin cambiar de pestaña manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>¿Quieres pasar masa de forma eficiente a otra célula? Usa Fast-Feed. Pulsa Freeze Mouse en la dirección deseada y pulsa el bind de Fast-Feed. Solo se divide la ventana desde la que pulsaste el bind.</p><p>El script hace 5 splits (32 partes), espera el tiempo indicado y hace otros 5 splits (32 partes). P.D. Con masa alta (~800k), sube el deslizador de retraso a unos 850ms para que no se active demasiado pronto.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Antes pensábamos que el juego estaba demasiado protegido, por lo que Auto-Rev solo funcionaba analizando la imagen de la pantalla. Resultó que no es así, y ahora hay dos métodos disponibles en el menú: <strong>WebSocket</strong> y <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – funciona directamente con los datos del servidor:</p><ol><li><strong>No reacciona a ti ni a tus compañeros:</strong> al fijar un objetivo, el script descarta tus propias células y a los miembros de tu party. No fijarás ni a ti mismo ni a un compañero, incluso si este tapa al enemigo bajo el cursor.</li><li><strong>No requiere cambiar los ajustes:</strong> funciona sin problemas con las skins, la masa y los nombres enemigos activados. No le molestan otras células encima, el movimiento de cámara ni el zoom (siempre que el objetivo siga dentro del alcance de visión del <strong>SERVIDOR</strong>).</li><li><strong>Reacción instantánea sin falsos disparos:</strong> se activa en el mismo instante en que llega el paquete del servidor confirmando que el jugador fijado se ha dividido. Si tú o el objetivo morís, o si la partida se reinicia, el bloqueo se quita automáticamente. Para un rendimiento estable siguen haciendo falta un buen ping y buenos FPS.</li></ol><p><strong>Pixi (método visual de respaldo)</strong> – el método antiguo que lee la imagen de la pantalla. Sirve por si alguna actualización del juego rompe temporalmente la lectura por WebSocket. Aquí los requisitos son un poco más estrictos: necesitas FPS y ping estables, y además:</p><ol><li>El objetivo debe verse por completo: sin estar tapado por otras células ni por los bordes de la pantalla.</li><li>Estás <strong class='auto-rev-glow'>OBLIGADO</strong> a desactivar las skins, la masa y los nombres de los enemigos en los ajustes del juego, o habrá falsos disparos.</li><li>La cámara debe permanecer quieta; no hagas zoom durante el bloqueo.</li><li>Este método tiene un retardo de ~10ms, pero no depende del código interno del juego y seguirá funcionando tras cualquier actualización.</li></ol><p><strong>Nota:</strong> No se recomienda configurar más de dos splits (4 partes / 2x), ya que simplemente no llegarás a tiempo al objetivo por la propia física del juego.</p>",
        noVideo: "Video no disponible",
        codeLink: "Código actual"
      },
      pt: {
        alert: "Este script não funcionará em nenhum navegador russo.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Esta função foi feita principalmente para jogar de multibox: uma célula grande e uma pequena. Na célula grande, aponte o cursor para o lado do trick e APERTE (toggle) Freeze Mouse (ou Line + Freeze Mouse). Não segure, apenas aperte, senão a célula grande vai se dividir para o outro lado.</p><p>Depois vá para a janela da célula pequena e aperte o bind correspondente à massa atual dela. Por exemplo, com ~30k de massa aperte a tecla 7 (já vem por padrão, você pode rebindar) (Trick 128). A pequena vai dividir 7 vezes na hora (128 pedaços) na direção do cursor. Ao mesmo tempo, a grande em segundo plano fará 5 splits (32 pedaços) na linha congelada, aguardará o tempo definido (Solo Delay - 800ms por padrão) e dividirá mais 5 vezes (32 pedaços).</p><p>Logo após apertar o bind, basta segurar sua tecla normal de feed do jogo para se alimentar bem para o Solo Trick. Isso garante um solo-trick limpo sem trocar de abas manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Quer passar massa de forma eficiente para outra célula? Use o Fast-Feed. Aperte Freeze Mouse na direção desejada e aperte o bind do Fast-Feed. Apenas a janela de onde o bind foi pressionado será dividida.</p><p>O script faz 5 splits (32 pedaços), aguarda o tempo definido e faz mais 5 splits (32 pedaços). P.S. Com massa alta (~800k), aumente o controle de atraso para cerca de 850ms para a divisão não disparar cedo demais.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Antes achávamos que o jogo era protegido demais, então o Auto-Rev funcionava apenas analisando a imagem da tela. Mas descobrimos que não é bem assim, e agora há dois métodos disponíveis no menu: <strong>WebSocket</strong> e <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – funciona diretamente pelos dados do servidor:</p><ol><li><strong>Não reage a você nem aos aliados:</strong> ao travar o alvo, o script filtra suas próprias células e os membros da sua party. Você não vai travar em si mesmo nem em um aliado, mesmo que ele esteja por cima do inimigo sob o cursor.</li><li><strong>Não exige mudar configurações:</strong> funciona normalmente com skins, massa e nicks inimigos ativados. Sobreposição de outras células, movimento da câmera e zoom não atrapalham (desde que o alvo continue na área de visão do <strong>SERVIDOR</strong>).</li><li><strong>Reação instantânea sem falsos disparos:</strong> ativa no exato momento em que chega o pacote do servidor informando que o jogador travado se dividiu. Se você ou o alvo morrerem, ou se a partida reiniciar, a trava é removida automaticamente. Para funcionar bem, ainda são necessários bom ping e FPS estáveis.</li></ol><p><strong>Pixi (método visual reserva)</strong> – o método antigo que lê a imagem da tela. Serve caso alguma atualização do jogo quebre temporariamente a leitura via WebSocket. Aqui as condições são um pouco mais rígidas – você precisa de FPS e ping constantemente bons, além disso:</p><ol><li>O alvo deve estar totalmente visível: sem ficar coberto por outras células ou pelas bordas da tela.</li><li>Você é <strong class='auto-rev-glow'>OBRIGADO</strong> a desativar skins, massa e nicks dos inimigos nas configurações do jogo, senão haverá falsos disparos.</li><li>A câmera deve ficar parada; não dê zoom durante o lock.</li><li>Esse método tem um atraso de ~10ms, mas não depende do código interno do jogo e continuará funcionando após qualquer atualização.</li></ol><p><strong>Observação:</strong> Não é recomendado usar mais de dois splits (4 pedaços / 2x), pois você simplesmente não chegará ao alvo a tempo pela própria física do jogo.</p>",
        noVideo: "Vídeo indisponível",
        codeLink: "Código atual"
      },
      fr: {
        alert: "Ce script ne fonctionnera dans aucun navigateur russe.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Cette fonction est surtout conçue pour le jeu en multibox : une grande cellule et une petite. Sur la grande cellule, pointez le curseur vers la direction du trick et APPUYEZ (toggle) sur Freeze Mouse (ou Line + Freeze Mouse). Ne maintenez pas la touche, appuyez juste dessus, sinon la grande cellule se divisera dans une autre direction.</p><p>Passez ensuite sur la fenêtre de la petite cellule et appuyez sur le bind adapté à sa masse actuelle. Par exemple, vers ~30k de masse, appuyez sur la touche 7 (par défaut, vous pouvez la rebind) (Trick 128). La petite cellule se divisera instantanément 7 fois (128 parts) vers le curseur. En même temps, la grande cellule en arrière-plan fera 5 splits (32 parts) sur la ligne gelée, attendra le délai réglé (Solo Delay - 800ms par défaut) puis se divisera encore 5 fois (32 parts).</p><p>Juste après avoir appuyé sur le bind, il ne vous reste qu'à maintenir votre touche normale de feed du jeu pour bien alimenter le Solo Trick. Cela donne un solo-trick propre sans changer d'onglet à la main.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Vous voulez envoyer efficacement de la masse dans une autre cellule ? Utilisez Fast-Feed. Appuyez sur Freeze Mouse dans la bonne direction puis appuyez sur le bind Fast-Feed. Seule la fenêtre depuis laquelle le bind est pressé se divisera.</p><p>Le script fait 5 splits (32 parts), attend le délai défini et refait 5 splits (32 parts). P.S. Avec une grosse masse (~800k), montez le curseur de délai vers 850ms pour éviter que la division ne parte trop tôt.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Nous pensions auparavant que le jeu était trop protégé, donc Auto-Rev fonctionnait uniquement par analyse d'image. Il s'est avéré que ce n'est pas le cas, et deux méthodes sont désormais disponibles dans le menu : <strong>WebSocket</strong> et <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – fonctionne directement via les données du serveur :</p><ol><li><strong>Ne réagit ni à vous ni à vos coéquipiers :</strong> lors du verrouillage, le script exclut vos propres cellules et les membres de votre party. Vous ne verrouillerez ni vous-même ni un allié, même si un coéquipier recouvre l'ennemi sous le curseur.</li><li><strong>Aucun réglage à modifier :</strong> fonctionne sans souci avec les skins, l'affichage de la masse et les pseudos ennemis activés. Les cellules superposées, les mouvements de caméra et le zoom ne le gênent pas (tant que la cible reste dans la zone de visibilité du <strong>SERVEUR</strong>).</li><li><strong>Réaction instantanée sans faux déclenchements :</strong> se déclenche dès réception du paquet serveur indiquant que le joueur verrouillé s'est divisé. Si vous mourez, si la cible meurt ou si la partie est réinitialisée, le verrouillage se retire automatiquement. Un bon ping et de bons FPS restent nécessaires pour un fonctionnement stable.</li></ol><p><strong>Pixi (méthode visuelle de secours)</strong> – l'ancienne méthode qui lit l'image à l'écran. Utile si une mise à jour du jeu casse temporairement la lecture WebSocket. Ici, les conditions sont un peu plus strictes – il faut des FPS et un ping constamment bons, ainsi que :</p><ol><li>La cible doit être entièrement visible : ni masquée par d'autres cellules ni coupée par les bords de l'écran.</li><li>Vous êtes <strong class='auto-rev-glow'>OBLIGÉ</strong> de désactiver les skins, la masse et les pseudos ennemis dans les paramètres du jeu, sinon il y aura de faux déclenchements.</li><li>La caméra doit rester immobile ; ne zoomez pas pendant le verrouillage.</li><li>Cette méthode a un délai d'environ 10ms, mais ne dépend pas du code interne du jeu et continuera de fonctionner après toute mise à jour.</li></ol><p><strong>Remarque :</strong> Il est déconseillé de mettre plus de deux splits (4 parts / 2x), car vous n'atteindrez tout simplement pas la cible à temps à cause de la physique même du jeu.</p>",
        noVideo: "Vidéo indisponible",
        codeLink: "Code actuel"
      },
      de: {
        alert: "Dieses Script wird in keinem russischen Browser funktionieren.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Diese Funktion ist hauptsächlich für das Spielen mit Multibox gedacht: eine große und eine kleine Zelle. Zeige auf der großen Zelle mit dem Cursor in Trick-Richtung und DRÜCKE (toggle) Freeze Mouse (oder Line + Freeze Mouse). Nicht gedrückt halten, sondern kurz drücken, sonst teilt sich die große Zelle in die falsche Richtung.</p><p>Wechsle danach ins Fenster der kleinen Zelle und drücke den Bind für ihre aktuelle Masse. Bei ca. ~30k Masse drücke z.B. Taste 7 (ist standardmäßig belegt, kannst du umbelegen) (Trick 128). Die kleine Zelle teilt sich sofort 7-mal (128 Teile) Richtung Cursor. Gleichzeitig macht die große Zelle im Hintergrund 5 Splits (32 Teile) entlang der eingefrorenen Linie, wartet die eingestellte Zeit (Solo Delay - Standard 800ms) und teilt sich erneut 5-mal (32 Teile).</p><p>Direkt nach dem Drücken musst du nur noch deine normale Ingame-Feed-Taste gedrückt halten, um für den Solo Trick sauber zu füttern. Das ergibt einen sauberen Solo-Trick ohne manuelles Tab-Wechseln.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Willst du Masse effizient in eine andere Zelle pumpen? Nutze Fast-Feed. Drücke Freeze Mouse in die gewünschte Richtung und drücke den Fast-Feed-Bind. Nur das Fenster, in dem der Bind gedrückt wurde, teilt sich.</p><p>Das Script macht 5 Splits (32 Teile), wartet die eingestellte Zeit und macht weitere 5 Splits (32 Teile). P.S. Bei hoher Masse (~800k) stelle den Delay-Regler auf etwa 850ms, damit der Split nicht zu früh auslöst.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Früher dachten wir, das Spiel sei zu stark geschützt, weshalb Auto-Rev nur über Bildanalyse funktionierte. Es stellte sich heraus, dass dem nicht so ist, und jetzt stehen im Menü zwei Methoden zur Verfügung: <strong>WebSocket</strong> und <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – arbeitet direkt mit den Serverdaten:</p><ol><li><strong>Reagiert nicht auf dich und Teammates:</strong> Beim Fixieren filtert das Script deine eigenen Zellen und deine Party-Mitglieder heraus. Du fixierst weder dich selbst noch einen Mitspieler, selbst wenn ein Teammate den Gegner unter dem Cursor verdeckt.</li><li><strong>Keine Einstellungsänderungen nötig:</strong> Funktioniert problemlos mit aktivierten Skins, Massenanzeige und gegnerischen Namen. Überlappende Zellen, Kamerabewegungen und Zoomen stören nicht (solange das Ziel im Sichtbereich des <strong>SERVERS</strong> bleibt).</li><li><strong>Sofortige Reaktion ohne Fehlauslösungen:</strong> Löst exakt in dem Moment aus, in dem das Serverpaket über die Teilung des fixierten Spielers eintrifft. Stirbst du, stirbt das Ziel oder wird das Match zurückgesetzt, wird der Lock automatisch aufgehoben. Für einen stabilen Betrieb sind weiterhin guter Ping und stabile FPS nötig.</li></ol><p><strong>Pixi (visuelle Backup-Methode)</strong> – die alte Methode, die das Bild vom Bildschirm ausliest. Nützlich, falls ein Spiel-Update das Auslesen per WebSocket vorübergehend unterbricht. Hier sind die Bedingungen etwas strenger – erforderlich sind konstant gute FPS und niedriger Ping sowie:</p><ol><li>Das Ziel muss vollständig sichtbar sein: weder von anderen Zellen noch vom Bildschirmrand verdeckt.</li><li>Du <strong class='auto-rev-glow'>MUSST</strong> Skins, Masse und gegnerische Namen in den Spieleinstellungen deaktivieren, sonst kommt es zu Fehlauslösungen.</li><li>Die Kamera muss ruhig bleiben; zoome während des Locks nicht.</li><li>Diese Methode hat eine Verzögerung von ~10ms, hängt aber nicht vom internen Spielcode ab und funktioniert nach jedem Update weiter.</li></ol><p><strong>Hinweis:</strong> Mehr als zwei Splits (4 Teile / 2x) einzustellen wird nicht empfohlen, da du das Ziel aufgrund der Spielphysik schlicht nicht rechtzeitig erreichst.</p>",
        noVideo: "Video nicht verfügbar",
        codeLink: "Aktueller Code"
      },
      it: {
        alert: "Questo script non funzionerà in nessun browser russo.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Questa funzione è pensata principalmente per giocare in multibox: una cellula grande e una piccola. Sulla cellula grande punta il cursore nella direzione del trick e PREMI (toggle) Freeze Mouse (o Line + Freeze Mouse). Non tenere premuto, premi e basta, altrimenti la cellula grande si dividerà da un'altra parte.</p><p>Poi passa alla finestra della cellula piccola e premi il bind adatto alla sua massa attuale. Ad esempio, con ~30k di massa premi il tasto 7 (è impostato di default, puoi cambiarlo) (Trick 128). La piccola si dividerà subito 7 volte (128 parti) verso il cursore. Allo stesso tempo la grande in background farà 5 split (32 parti) lungo la linea bloccata, aspetterà il tempo impostato (Solo Delay - 800ms predefiniti) e si dividerà altre 5 volte (32 parti).</p><p>Subito dopo aver premuto il bind, ti resta solo da tenere premuto il tasto normale di feed del gioco per nutrirti con successo per il Solo Trick. Questo ti dà un solo-trick pulito senza cambiare scheda manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Vuoi passare massa in modo efficace in un'altra cellula? Usa Fast-Feed. Premi Freeze Mouse nella direzione voluta e premi il bind di Fast-Feed. Si divide solo la finestra da cui è stato premuto il bind.</p><p>Lo script fa 5 split (32 parti), aspetta il tempo impostato e fa altri 5 split (32 parti). P.S. Con massa elevata (~800k) aumenta lo slider del ritardo a circa 850ms per non far partire la divisione troppo presto.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Prima pensavamo che il gioco fosse troppo protetto, quindi Auto-Rev funzionava solo tramite l'analisi dell'immagine sullo schermo. Si è scoperto che non è così, e ora nel menu sono disponibili due metodi: <strong>WebSocket</strong> e <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – lavora direttamente attraverso i dati del server:</p><ol><li><strong>Non reagisce a te e ai compagni:</strong> durante il blocco del bersaglio, lo script esclude le tue cellule e i membri del tuo party. Non bloccherai mai te stesso o un compagno, nemmeno se quest'ultimo copre il nemico sotto il cursore.</li><li><strong>Non richiede di cambiare impostazioni:</strong> funziona tranquillamente con skin, massa e nomi nemici attivi. Sovrapposizioni con altre cellule, movimenti della visuale e zoom non lo disturbano (purché il bersaglio resti nella zona visibile del <strong>SERVER</strong>).</li><li><strong>Reazione istantanea senza falsi scatti:</strong> si attiva nel momento esatto in cui arriva il pacchetto dal server che conferma la divisione del giocatore bloccato. Se muori tu, muore il bersaglio o la partita si resetta, il blocco si toglie automaticamente. Per una resa stabile servono comunque un buon ping e FPS regolari.</li></ol><p><strong>Pixi (metodo visivo di riserva)</strong> – il vecchio metodo che legge l'immagine dallo schermo. Serve nel caso in cui un aggiornamento del gioco comprometta temporaneamente la lettura WebSocket. Qui le condizioni sono un po' più rigide – servono FPS e ping costantemente buoni, e inoltre:</p><ol><li>Il bersaglio deve essere visibile per intero: non coperto da altre cellule o dai bordi dello schermo.</li><li>Sei <strong class='auto-rev-glow'>OBBLIGATO</strong> a disattivare skin, massa e nomi nemici nelle impostazioni di gioco, altrimenti ci saranno falsi scatti.</li><li>La visuale deve restare ferma; non fare zoom durante il lock.</li><li>Questo metodo ha un ritardo di ~10ms, ma non dipende dal codice interno del gioco e continuerà a funzionare dopo qualsiasi aggiornamento.</li></ol><p><strong>Nota:</strong> Non è consigliabile impostare più di due split (4 parti / 2x), perché per la fisica stessa del gioco non faresti semplicemente in tempo a raggiungere il bersaglio.</p>",
        noVideo: "Video non disponibile",
        codeLink: "Codice attuale"
      },
      pl: {
        alert: "Ten skrypt nie będzie działać w żadnej rosyjskiej przeglądarce.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Funkcja stworzona głównie do gry z multiboxem: jedna duża i jedna mała kulka. Na dużej kulce nakieruj kursor w stronę tricka i NACIŚNIJ (toggle) Freeze Mouse (lub Line + Freeze Mouse). Nie przytrzymuj, tylko naciśnij, inaczej duża kulka podzieli się w inną stronę.</p><p>Następnie przejdź do okna z małą kulką i wciśnij bind dobrany do jej aktualnej masy. Na przykład przy masie ~30k wciśnij klawisz 7 (jest domyślny, możesz go zmienić) (Trick 128). Mała kulka natychmiast podzieli się 7 razy (na 128 części) w stronę kursora. Jednocześnie duża w tle zrobi 5 splitów (32 części) po zamrożonej linii, odczeka ustawiony czas (Solo Delay - domyślnie 800ms) i podzieli się kolejne 5 razy (32 części).</p><p>Zaraz po wciśnięciu binda wystarczy przytrzymać zwykły klawisz karmienia w grze, aby skutecznie nakarmić się pod Solo Tricka. Daje to czysty solo-trick bez ręcznego przełączania kart.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Chcesz skutecznie wlać masę w inną kulkę? Użyj Fast-Feed. Naciśnij Freeze Mouse w odpowiednim kierunku i wciśnij bind Fast-Feeda. Dzieli się tylko to okno, z którego wciśnięto bind.</p><p>Skrypt robi 5 splitów (32 części), czeka ustawiony czas i robi kolejne 5 splitów (32 części). P.S. Przy dużej masie (~800k) zwiększ suwak opóźnienia do około 850ms, aby podział nie zadziałał za wcześnie.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Wcześniej sądziliśmy, że gra jest zbyt mocno zabezpieczona, dlatego auto-rev działał wyłącznie przez analizę obrazu. Okazało się jednak, że tak nie jest, i teraz w menu są dostępne dwie metody działania: <strong>WebSocket</strong> oraz <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – działa bezpośrednio na danych z serwera:</p><ol><li><strong>Nie reaguje na ciebie i sojuszników:</strong> przy namierzaniu celu skrypt odfiltrowuje twoje kulki oraz członków twojego party. Nie zablokujesz siebie ani sojusznika, nawet jeśli kolega z drużyny zasłania wroga pod kursorem.</li><li><strong>Nie wymaga zmian w ustawieniach:</strong> bez problemu działa z włączonymi skinami, pokazywaniem masy i nickami wrogów. Nie przeszkadzają mu nachodzące na siebie kulki, ruch kamery ani zoom (ważne tylko, aby cel pozostawał w zasięgu widoczności <strong>SERWERA</strong>).</li><li><strong>Natychmiastowa reakcja bez fałszywych zadziałań:</strong> rev odpala się w chwili otrzymania pakietu z serwera o podziale namierzonego gracza. Gdy zginiesz ty, zginie cel lub mecz zostanie zresetowany, blokada zdejmuje się automatycznie. Do stabilnego działania nadal potrzebny jest dobry ping i FPS.</li></ol><p><strong>Pixi (zapasowy tryb wizualny)</strong> – starsza metoda sczytująca obraz z ekranu. Przydaje się na wypadek, gdyby aktualizacja gry tymczasowo popsuła odczyt WebSocket. Tutaj warunki są nieco ostrzejsze – potrzebne są stabilnie wysokie FPS i niski ping, a ponadto:</p><ol><li>Cel musi być w pełni widoczny: niezasłonięty przez inne kulki ani krawędzie ekranu.</li><li>Jesteś <strong class='auto-rev-glow'>ZOBOWIĄZANY</strong> wyłączyć skiny, masę i nicki wrogów w ustawieniach gry, w przeciwnym razie wystąpią fałszywe reakcje.</li><li>Kamera musi być nieruchoma, nie przybliżaj ani nie oddalaj podczas locka.</li><li>Ta metoda ma opóźnienie ~10ms, ale nie zależy od wewnętrznego kodu gry i będzie działać po kolejnych aktualizacjach.</li></ol><p><strong>Uwaga:</strong> Nie zaleca się ustawiania więcej niż dwóch splitów (4 części / 2x), ponieważ przez samą fizykę gry po prostu nie zdążysz dolecieć do celu.</p>",

      nl: {

        soloTitle: "Solo-Trick",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>Eerder dachten we dat de game te streng beveiligd was, waardoor Auto-Rev alleen via beeldanalyse werkte. Dat bleek mee te vallen, en nu zijn er twee methodes beschikbaar in het menu: <strong>WebSocket</strong> en <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – werkt rechtstreeks via servergegevens:</p><ol><li><strong>Reageert niet op jou of teamgenoten:</strong> bij het locken filtert het script je eigen cellen en je party-leden eruit. Je lockt nooit op jezelf of een teamgenoot, zelfs niet als een teamgenoot de vijand onder je cursor overlapt.</li><li><strong>Geen instellingen aanpassen nodig:</strong> werkt probleemloos met skins, massaweergave en vijandelijke namen ingeschakeld. Overlappende cellen, camerabewegingen en zoomen hinderen hem niet (zolang het doel binnen het zichtbereik van de <strong>SERVER</strong> blijft).</li><li><strong>Directe reactie zonder valse triggers:</strong> gaat direct af op het moment dat het serverpakket binnenkomt dat de gelockte speler is gesplitst. Als jij sterft, het doel sterft of de match reset, vervalt de lock automatisch. Voor stabiele werking blijven goede ping en FPS nodig.</li></ol><p><strong>Pixi (visuele back-upmethode)</strong> – de oude methode die het beeld van het scherm uitleest. Handig voor het geval een game-update het uitlezen via WebSocket tijdelijk breekt. Hier zijn de eisen iets strenger – je hebt constant goede FPS en ping nodig, en ook:</p><ol><li>Het doel moet volledig zichtbaar zijn: niet bedekt door andere cellen of schermranden.</li><li>Je bent <strong class='auto-rev-glow'>VERPLICHT</strong> om skins, massa en vijandelijke namen uit te zetten in de spelinstellingen, anders krijg je valse triggers.</li><li>De camera moet stil blijven staan; zoom niet tijdens een lock.</li><li>Deze methode heeft ~10ms vertraging, maar hangt niet af van de interne gamecode en blijft na updates gewoon werken.</li></ol><p><strong>Opmerking:</strong> Meer dan twee splits (4 delen / 2x) instellen wordt afgeraden, omdat je het doel door de fysica van de game simpelweg niet op tijd bereikt.</p>",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>Înainte credeam că jocul este prea protejat, așa că auto-rev funcționa doar prin analiza imaginii de pe ecran. S-a dovedit că nu este așa, iar acum în meniu sunt disponibile două metode: <strong>WebSocket</strong> și <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – funcționează direct prin datele serverului:</p><ol><li><strong>Nu reacționează la tine și la coechipieri:</strong> la blocarea țintei, scriptul filtrează celulele tale și membrii din party. Nu te vei bloca pe tine sau pe un coechipier, chiar dacă acesta acoperă inamicul de sub cursor.</li><li><strong>Nu necesită modificarea setărilor:</strong> merge fără probleme cu skin-urile, afișarea masei și numele inamicilor activate. Suprapunerile cu alte celule, mișcarea camerei și zoom-ul nu îl încurcă (important este ca ținta să rămână în raza de vizibilitate a <strong>SERVERULUI</strong>).</li><li><strong>Reacție instantanee fără declanșări false:</strong> se activează exact în momentul primirii pachetului de la server că jucătorul blocat s-a împărțit. Când mori tu, moare ținta sau meciul se resetează, blocarea se scoate automat. Pentru funcționare stabilă sunt în continuare necesare ping bun și FPS constante.</li></ol><p><strong>Pixi (metodă vizuală de rezervă)</strong> – metoda veche care citește imaginea de pe ecran. Este utilă în cazul în care un update al jocului strică temporar citirea prin WebSocket. Aici condițiile sunt puțin mai stricte – ai nevoie de FPS și ping constant bune, precum și:</p><ol><li>Ținta trebuie să fie complet vizibilă: neacoperită de alte celule sau de marginile ecranului.</li><li>Ești <strong class='auto-rev-glow'>OBLIGAT</strong> să dezactivezi skin-urile, masa și numele inamicilor din setările jocului, altfel vor apărea declanșări false.</li><li>Camera trebuie să fie nemișcată, nu da zoom în timpul lock-ului.</li><li>Această metodă are o întârziere de ~10ms, dar nu depinde de codul intern al jocului și va continua să funcționeze după orice actualizare       ar: {

        soloTitle: "Solo-Trick",
        soloDesc: "<p>هذه الميزة مصممة أساسًا للعب بالمالتي بوكس: كرة كبيرة وكرة صغيرة. على الكرة الكبيرة وجّه المؤشر نحو اتجاه التريك واضغط (toggle) على Freeze Mouse (أو Line + Freeze Mouse). لا تضغط باستمرار بل اضغط فقط، وإلا ستنقسم الكرة الكبيرة في اتجاه آخر.</p><p>بعد ذلك انتقل إلى نافذة الكرة الصغيرة واضغط الزر المناسب لكتلتها الحالية. مثلاً عند كتلة ~30k اضغط المفتاح 7 (هذا هو الافتراضي، ويمكنك تغييره) (Trick 128). ستنقسم الكرة الصغيرة فوراً 7 مرات (128 جزءاً) نحو المؤشر. وفي الوقت نفسه ستقوم الكرة الكبيرة في الخلفية بـ 5 انقسامات (32 جزءاً) على الخط المجمد، وتنتظر الوقت المحدد (Solo Delay - الافتراضي 800ms) ثم تنقسم 5 مرات أخرى (32 جزءاً).</p><p>مباشرة بعد الضغط على الزر، ما عليك سوى الضغط باستمرار على زر التغذية العادي في اللعبة لتتغذى بنجاح من أجل Solo Trick. هذا يمنحك سولو تريك نظيفاً بدون تبديل النوافذ يدوياً.</p>",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>في السابق كنا نظن أن اللعبة محمية بشكل مبالغ فيه، لذلك كان Auto-Rev يعمل فقط عبر تحليل صورة الشاشة. لكن اتضح أن الأمر ليس كذلك، والآن يتوفر في القائمة أسلوبان للعمل: <strong>WebSocket</strong> و<strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – يعمل مباشرة عبر بيانات السيرفر:</p><ol><li><strong>لا يتفاعل معك أو مع زملائك في الفريق:</strong> عند تثبيت الهدف يستبعد السكربت كراتك وأعضاء مجموعتك (البارتي). لن تثبّت على نفسك أو على زميلك حتى لو كان يغطي الخصم تحت المؤشر.</li><li><strong>لا يتطلب تغيير الإعدادات:</strong> يعمل بسلاسة مع تفعيل السكينات وإظهار الكتلة وأسماء الخصوم. لا يؤثر عليه تداخل الكرات الأخرى أو حركة الكاميرا أو التكبير والتصغير (الأهم أن يبقى الهدف ضمن نطاق رؤية <strong>السيرفر</strong>).</li><li><strong>استجابة فورية بدون تفعيلات خاطئة:</strong> ينطلق في لحظة وصول حزمة السيرفر التي تفيد بانقسام اللاعب المثبّت. عند موتك أو موت الهدف أو إعادة ضبط المباراة يُزال التثبيت تلقائياً. ولأداء مستقر لا يزال يلزم بينغ جيد وFPS ثابت.</li></ol><p><strong>Pixi (طريقة بصرية احتياطية)</strong> – الطريقة القديمة التي تقرأ الصورة من الشاشة. توجد في حال تسبب تحديث للعبة بتعطيل قراءة WebSocket مؤقتاً. هنا الشروط أكثر صرامة قليلاً – تحتاج إلى FPS وبينغ جيدين باستمرار، وأيضاً:</p><ol><li>يجب أن يكون الهدف مرئياً بالكامل: غير مغطى بكرات أخرى أو بحواف الشاشة.</li><li>أنت <strong class='auto-rev-glow'>مُلزم</strong> بإيقاف السكينات والكتلة وأسماء الخصوم في إعدادات اللعبة، وإلا فستحدث استجابات خاطئة.</li><li>يجب أن تبقى الكاميرا ثابتة، ولا تقم بالتكبير أو التصغير أثناء القفل.</li><li>يوجد في هذه الطريقة تأخير ~10ms، لكنها لا تعتمد على الكود الداخلي للعبة وستواصل العمل بعد أي تحديثات.</li></ol><p><strong>ملاحظة:</strong> لا يُنصح بوضع أكثر من انقسامين (4 أجزاء / 2x)، لأنك ببساطة لن تلحق بالوصول إلى الهدف بسبب فيزياء اللعبة نفسها.</p>",

        soloDesc: "<p>यह फीचर मुख्य रूप से मल्टीबॉक्स खेलने के लिए बनाया गया है: एक बड़ी और एक छोटी सेल। बड़ी सेल पर कर्सर को ट्रिक की दिशा में रखें और Freeze Mouse (या Line + Freeze Mouse) को दबाएँ (toggle)। दबाकर न रखें, बस एक बार दबाएँ, वरना बड़ी सेल दूसरी दिशा में स्प्लिट हो जाएगी।</p><p>फिर छोटी सेल वाली विंडो में जाएँ और उसकी मौजूदा मास के हिसाब से बाइंड दबाएँ। उदाहरण के लिए, ~30k मास पर कुंजी 7 दबाएँ (यह डिफ़ॉल्ट है, आप इसे रीबाइंड कर सकते हैं) (Trick 128)। छोटी सेल तुरंत कर्सर की ओर 7 बार (128 हिस्सों में) स्प्लिट हो जाएगी। उसी समय बैकग्राउंड में बड़ी सेल फ़्रोज़न लाइन पर 5 स्प्लिट (32 हिस्से) करेगी, तय समय (Solo Delay - डिफ़ॉल्ट 800ms) का इंतज़ार करेगी और फिर 5 बार (32 हिस्से) स्प्लिट होगी।</p><p>बाइंड दबाने के तुरंत बाद आपको बस गेम की सामान्य फ़ीड कुंजी दबाए रखनी है ताकि आप Solo Trick के लिए सही से फ़ीड कर सकें। इससे बिना मैन्युअल टैब बदले साफ़ सोलो-ट्रिक होता है।</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>किसी दूसरी सेल में तेज़ी और असरदार तरीके से मास डालना चाहते हैं? Fast-Feed का उपयोग करें। सही दिशा में Freeze Mouse दबाएँ और Fast-Feed बाइंड दबाएँ। केवल वही विंडो स्प्लिट होगी जहाँ से बाइंड दबाया गया है।</p><p>स्क्रिप्ट 5 स्प्लिट (32 हिस्से) करती है, तय समय तक रुकती है और फिर 5 स्प्लिट (32 हिस्से) करती है। नोट: बड़ी मास (~800k) पर डिले स्लाइडर को लगभग 850ms तक बढ़ा दें ताकि स्प्लिट बहुत जल्दी न हो जाए।</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>पहले हमें लगता था कि गेम बहुत ज़्यादा सुरक्षित है, इसलिए Auto-Rev सिर्फ़ स्क्रीन की इमेज के विश्लेषण से काम करता था। लेकिन ऐसा नहीं निकला, और अब मेनू में काम करने के दो तरीके उपलब्ध हैं: <strong>WebSocket</strong> और <strong>Pixi</strong>।</p><p><strong>WebSocket</strong> – सीधे सर्वर डेटा के ज़रिए काम करता है:</p><ol><li><strong>आप और टीममेट्स पर रिएक्ट नहीं करता:</strong> टारगेट लॉक करते समय स्क्रिप्ट आपकी अपनी सेल्स और आपकी पार्टी के सदस्यों को अलग कर देती है। आप खुद को या टीममेट को लॉक नहीं करेंगे, भले ही टीममेट कर्सर के नीचे दुश्मन को ढक रहा हो।</li><li><strong>सेटिंग्स बदलने की ज़रूरत नहीं:</strong> स्किन, मास डिस्प्ले और दुश्मनों के नाम चालू होने पर भी आराम से काम करता है। दूसरी सेल्स के ऊपर आने, कैमरा हिलने और ज़ूम करने से इस पर फ़र्क नहीं पड़ता (बस टारगेट <strong>सर्वर</strong> की विज़िबिलिटी रेंज में रहना चाहिए)।</li><li><strong>बिना गलत ट्रिगर के तुरंत रिएक्शन:</strong> जैसे ही सर्वर से पैकेट आता है कि लॉक किया गया खिलाड़ी स्प्लिट हुआ है, उसी पल यह ट्रिगर हो जाता है। आपके मरने, टारगेट के मरने या मैच रीसेट होने पर लॉक अपने आप हट जाता है। स्थिर काम के लिए अच्छा पिंग और FPS अब भी ज़रूरी हैं।</li></ol><p><strong>Pixi (बैकअप विज़ुअल तरीका)</strong> – पुराना तरीका, जो स्क्रीन से तस्वीर पढ़ता है। यह इस स्थिति के लिए है अगर गेम का कोई अपडेट अस्थायी रूप से WebSocket रीडिंग को तोड़ दे। यहाँ शर्तें थोड़ी ज़्यादा सख़्त हैं – लगातार अच्छे FPS और पिंग चाहिए, और साथ ही:</p><ol><li>टारगेट पूरी तरह दिखना चाहिए: दूसरी सेल्स या स्क्रीन के किनारों से ढका नहीं होना चाहिए।</li><li>आपको गेम सेटिंग्स में स्किन, मास और दुश्मनों के नाम बंद करना <strong class='auto-rev-glow'>अनिवार्य</strong> है, वरना गलत ट्रिगर होंगे।</li><li>कैमरा स्थिर रहना चाहिए, लॉक के दौरान ज़ूम न करें।</li><li>इस तरीके में ~10ms की देरी है, लेकिन यह गेम के अंदरूनी कोड पर निर्भर नहीं है और किसी भी अपडेट के बाद चलता रहेगा।</li></ol><p><strong>नोट:</strong> दो स्प्लिट (4 हिस्से / 2x) से ज़्यादा रखने की सलाह नहीं दी जाती, क्योंकि गेम की अपनी फ़िज़िक्स की वजह से आप बस समय पर टारगेट तक पहुँच ही नहीं पाएँगे।</p>",

        fastTitle: "Fast-Feed",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>以前我们以为游戏保护得太严，所以 Auto-Rev 只能通过画面图像分析来工作。但事实并非如此，现在菜单中提供了两种工作方式：<strong>WebSocket</strong> 和 <strong>Pixi</strong>。</p><p><strong>WebSocket</strong> – 直接通过服务器数据工作：</p><ol><li><strong>不会误锁自己和队友：</strong>锁定目标时，脚本会过滤掉你自己的球以及你的组队成员。即使队友刚好挡在光标下的敌人上面，你也不会锁到自己或队友。</li><li><strong>无需修改游戏设置：</strong>开启皮肤、质量显示和敌方昵称时也能正常使用。其他球遮挡、镜头移动和缩放都不会影响它（只要目标仍在<strong>服务器</strong>可见范围内即可）。</li><li><strong>瞬时响应且无误触发：</strong>一旦收到目标玩家分裂的服务器数据包就会立刻触发。当你死亡、目标死亡或对局重置时，锁定会自动解除。为了稳定运行，仍需要良好的延迟和 FPS。</li></ol><p><strong>Pixi（备用视觉方式）</strong> – 从屏幕读取画面的旧方式。用于在游戏更新暂时破坏 WebSocket 读取时作为备选。这里的条件更严格一些 – 需要持续稳定的高 FPS 和低延迟，同时：</p><ol><li>目标必须完全可见：不能被其他球或屏幕边缘遮挡。</li><li>您<strong class='auto-rev-glow'>必须</strong>在游戏设置中关闭皮肤、质量和敌方昵称，否则会出现误触发。</li><li>视角必须保持静止，锁定期间不要缩放。</li><li>该方式约有 ~10ms 延迟，但它不依赖游戏内部代码，后续任何更新都能继续使用。</li></ol><p><strong>注意：</strong>不建议设置超过两次分裂（4 份 / 2x），因为按照游戏本身的物理机制，你根本来不及飞到目标位置。</p>",

        fastDesc: "<p>Want to efficiently dump mass into another cell? Use Fast-Feed. Only the window where the bind was pressed will split. Two methods are available in the menu: Auto and Manual (Manual is selected by default).</p><p>Auto – automatic mode with target lock and ping/distance compensation (uses two binds, both set to E by default):</p><ol><li>Target lock (Lock / Unlock) and launch (Activate): if both binds are on the same key (E), point your cursor at the needed cell (a teammate, your second window, or any cell except your current one), press Freeze Mouse, and press E – the target gets a yellow outline with a line from the center, and the script immediately makes the first 5 splits (32 pieces).</li><li>Separate binds (optional): if you set Lock / Unlock and Activate to different keys, you can toggle the lock on a teammate in advance with the first bind and feed into them repeatedly with the second bind without pointing the cursor at the target.</li><li>Accurate 2nd split timing: the script tracks the start of the 1st split, filters out your small cells (&lt; 15% of the largest cell), keeps the lock if the target splits or merges, accounts for ping and distance, and triggers the second 5 splits (32 pieces) right as your cells surge into the target.</li><li>Protection and cutoff: if the target is too far away, the script waits until it gets within reach; if it does not get close within 3 seconds, disappears, or you die – the wait cancels and the second split does not fire.</li></ol>",
        fastManual: "<p>Manual – classic mode using a fixed delay:</p><ol><li>Press Freeze Mouse in the needed direction and press the Fast-Feed bind.</li><li>The script does 5 splits (32 pieces), waits for the slider delay (800ms by default), and does another 5 splits (32 pieces).</li></ol><p>Note: In Manual mode at heavy mass (~800k), raise the delay slider to around 850ms so the split does not trigger too early. In Auto mode, normal ping and stable FPS are still important for consistent locking and accurate timing.</p>"
      },
      ru: {
        fastAutoLbl: "Авто",
        fastManLbl: "Ручной",
        fastDesc: "<p>Хотите эффективно влить массу в другой шар? Используйте Fast-Feed. Делится только то окно, с которого нажат бинд. В меню доступны два метода работы: Авто и Ручной (по умолчанию стоит Ручной).</p><p>Авто – автоматический режим с привязкой к цели и компенсацией пинга и расстояния (использует два бинда, оба по умолчанию на E):</p><ol><li>Захват цели (Лок / Анлок) и запуск (Активация): если оба бинда стоят на одной клавише (E), наведите курсор на нужную клетку (тиммейта, ваше второе окно или любую другую клетку, кроме вашей текущей), нажмите Freeze Mouse и нажмите E – цель обведётся жёлтой обводкой с линией от центра, а скрипт сразу сделает первые 5 сплитов (32 части).</li><li>Раздельные бинды (по желанию): если поставить Лок / Анлок и Активацию на разные клавиши, первым биндом можно заранее повесить или снять лок с тиммейта, а вторым многократно вливать в него без наведения курсора на цель.</li><li>Точный момент 2-го сплита: скрипт сам отслеживает старт 1-го деления, отсекает ваши мелкие куски (&lt; 15% от самого большого), сохраняет лок при делении или слиянии цели, учитывает пинг с дистанцией и прожимает вторые 5 сплитов (32 части) прямо к моменту влёта в цель.</li><li>Защита и отсечка: если цель слишком далеко, скрипт подождёт сближения, а если в течение 3 секунд цель так и не вошла в зону долёта, пропала или вы погибли – ожидание сбрасывается и второй сплит не срабатывает.</li></ol>",
        fastManual: "<p>Ручной – классический режим по заданной задержке:</p><ol><li>Нажмите Freeze Mouse в нужном направлении и нажмите бинд Fast-Feed.</li><li>Скрипт сделает 5 сплитов (32 части), подождёт заданное ползунком время (по умолчанию 800ms) и сделает ещё 5 сплитов (32 части).</li></ol><p>Примечание: В ручном режиме при большой массе (~800k) увеличьте ползунок задержки примерно до 850ms, чтобы деление не сработало слишком рано. В авто-режиме для стабильного захвата и точного тайминга всё так же важны нормальные пинг и FPS.</p>"
      },
      uk: {
        fastAutoLbl: "Авто",
        fastManLbl: "Ручний",
        fastDesc: "<p>Хочете ефективно влити масу в іншу кулю? Використовуйте Fast-Feed. Ділиться лише те вікно, з якого натиснуто бінд. У меню доступні два методи роботи: Авто та Ручний (за замовчуванням стоїть Ручний).</p><p>Авто – автоматичний режим із прив'язкою до цілі та компенсацією пінгу й відстані (використовує два бінди, обидва за замовчуванням на E):</p><ol><li>Захоплення цілі (Лок / Анлок) і запуск (Активація): якщо обидва бінди стоять на одній клавіші (E), наведіть курсор на потрібну кулю (тіммейта, ваше друге вікно або будь-яку іншу кулю, крім вашої поточної), натисніть Freeze Mouse і натисніть E – ціль обведеться жовтою обводкою з лінією від центру, а скрипт одразу зробить перші 5 сплітів (32 частини).</li><li>Окремі бінди (за бажанням): якщо поставити Лок / Анлок і Активацію на різні клавіші, першим біндом можна заздалегідь повісити або зняти лок із тіммейта, а другим багаторазово вливати в нього без наведення курсора на ціль.</li><li>Точний момент 2-го спліта: скрипт сам відстежує старт 1-го поділу, відсіює ваші дрібні шматки (&lt; 15% від найбільшого), зберігає лок при поділі або злитті цілі, враховує пінг із дистанцією та натискає другі 5 сплітів (32 частини) прямо до моменту вльоту в ціль.</li><li>Захист і відсікання: якщо ціль надто далеко, скрипт зачекає зближення, а якщо протягом 3 секунд ціль так і не увійшла в зону дольоту, зникла або ви загинули – очікування скидається і другий спліт не спрацьовує.</li></ol>",
        fastManual: "<p>Ручний – класичний режим за заданою затримкою:</p><ol><li>Натисніть Freeze Mouse у потрібному напрямку і натисніть бінд Fast-Feed.</li><li>Скрипт зробить 5 сплітів (32 частини), зачекає заданий повзунком час (за замовчуванням 800ms) і зробить ще 5 сплітів (32 частини).</li></ol><p>Примітка: У ручному режимі при великій масі (~800k) збільште повзунок затримки приблизно до 850ms, щоб поділ не спрацював занадто рано. В авто-режимі для стабільного захоплення і точного таймінгу так само важливі нормальні пінг і FPS.</p>"
      },
      es: {
        fastAutoLbl: "Auto",
        fastManLbl: "Manual",
        fastDesc: "<p>¿Quieres pasar masa de forma eficiente a otra célula? Usa Fast-Feed. Solo se divide la ventana desde la que pulsaste el bind. Hay dos métodos disponibles en el menú: Auto y Manual (por defecto está Manual).</p><p>Auto – modo automático con fijación de objetivo y compensación de ping y distancia (usa dos binds, ambos en E por defecto):</p><ol><li>Fijar objetivo (Bloquear / Soltar) y activar (Activar): si ambos binds están en la misma tecla (E), apunta el cursor a la célula deseada (un compañero, tu segunda ventana o cualquier célula excepto la tuya actual), pulsa Freeze Mouse y pulsa E – el objetivo tendrá un borde amarillo con una línea desde el centro, y el script hará al instante los primeros 5 splits (32 partes).</li><li>Binds separados (opcional): si pones Bloquear / Soltar y Activar en teclas distintas, puedes fijar o quitar el bloqueo con el primer bind y alimentar repetidamente con el segundo sin volver a apuntar al objetivo.</li><li>Momento exacto del 2.º split: el script detecta el inicio de la 1.ª división, ignora tus células pequeñas (&lt; 15% de la más grande), mantiene el bloqueo si el objetivo se divide o se fusiona, calcula el ping con la distancia y lanza los segundos 5 splits (32 partes) justo al entrar en el objetivo.</li><li>Protección y corte: si el objetivo está demasiado lejos, el script espera a que entre en alcance; si pasan 3 segundos sin acercarse, desaparece o mueres – la espera se cancela y el segundo split no se dispara.</li></ol>",
        fastManual: "<p>Manual – modo clásico por retardo fijo:</p><ol><li>Pulsa Freeze Mouse en la dirección deseada y pulsa el bind de Fast-Feed.</li><li>El script hace 5 splits (32 partes), espera el tiempo del deslizador (800ms por defecto) y hace otros 5 splits (32 partes).</li></ol><p>Nota: En modo Manual con masa alta (~800k), sube el deslizador de retraso a unos 850ms para que la división no salte demasiado pronto. En modo Auto siguen siendo importantes un buen ping y FPS estables para fijar y calcular bien el momento.</p>"
      },
      pt: {
        fastAutoLbl: "Auto",
        fastManLbl: "Manual",
        fastDesc: "<p>Quer passar massa de forma eficiente para outra célula? Use o Fast-Feed. Apenas a janela de onde o bind foi pressionado será dividida. Há dois métodos disponíveis no menu: Auto e Manual (o padrão é Manual).</p><p>Auto – modo automático com trava de alvo e compensação de ping e distância (usa dois binds, ambos em E por padrão):</p><ol><li>Travar alvo (Travar / Destravar) e iniciar (Ativar): se ambos os binds estiverem na mesma tecla (E), aponte o cursor para a célula desejada (um aliado, sua segunda janela ou qualquer outra célula, exceto a sua atual), aperte Freeze Mouse e aperte E – o alvo ganhará um contorno amarelo com linha a partir do centro, e o script fará na hora os primeiros 5 splits (32 pedaços).</li><li>Binds separados (opcional): se colocar Travar / Destravar e Ativar em teclas diferentes, você pode manter ou remover a trava com o primeiro bind e alimentar várias vezes com o segundo sem precisar mirar no alvo novamente.</li><li>Momento exato do 2º split: o script acompanha o início da 1ª divisão, ignora seus pedaços pequenos (&lt; 15% da maior célula), mantém a trava se o alvo dividir ou fundir, compensa ping e distância e dispara os outros 5 splits (32 pedaços) na hora exata de entrar no alvo.</li><li>Proteção e corte: se o alvo estiver longe demais, o script aguarda a aproximação; se passar de 3 segundos sem entrar no alcance, o alvo sumir ou você morrer – a espera é cancelada e o segundo split não dispara.</li></ol>",
        fastManual: "<p>Manual – modo clássico por atraso fixo:</p><ol><li>Aperte Freeze Mouse na direção desejada e aperte o bind do Fast-Feed.</li><li>O script faz 5 splits (32 pedaços), aguarda o tempo definido no controle (800ms por padrão) e faz mais 5 splits (32 pedaços).</li></ol><p>Observação: No modo Manual com massa alta (~800k), aumente o controle de atraso para cerca de 850ms para a divisão não disparar cedo demais. No modo Auto, bom ping e FPS estáveis continuam importantes para travar e acertar o tempo.</p>"
      },
      fr: {
        fastAutoLbl: "Auto",
        fastManLbl: "Manuel",
        fastDesc: "<p>Vous voulez envoyer efficacement de la masse dans une autre cellule ? Utilisez Fast-Feed. Seule la fenêtre depuis laquelle le bind est pressé se divisera. Deux méthodes sont disponibles dans le menu : Auto et Manuel (Manuel par défaut).</p><p>Auto – mode automatique avec verrouillage de cible et compensation du ping et de la distance (utilise deux binds, tous deux sur E par défaut) :</p><ol><li>Verrouillage (Verrouiller / Libérer) et lancement (Activer) : si les deux binds sont sur la même touche (E), placez le curseur sur la cellule voulue (un allié, votre deuxième fenêtre ou toute autre cellule sauf la vôtre actuelle), appuyez sur Freeze Mouse puis sur E – la cible s'entoure en jaune avec une ligne depuis le centre, et le script lance aussitôt les 5 premiers splits (32 parts).</li><li>Binds séparés (facultatif) : si vous mettez Verrouiller / Libérer et Activer sur des touches différentes, la première touche permet de garder ou retirer le verrou sur un allié, et la seconde de le nourrir plusieurs fois sans le viser de nouveau.</li><li>Timing précis du 2e split : le script détecte le début de la 1re division, ignore vos petits morceaux (&lt; 15% de la plus grande cellule), conserve le verrou si la cible se divise ou fusionne, calcule le ping avec la distance et déclenche les 5 splits suivants (32 parts) au moment où vos parts entrent dans la cible.</li><li>Protection et coupure : si la cible est trop loin, le script attend qu'elle entre à portée ; si elle reste hors de portée pendant 3 secondes, disparaît ou si vous mourez – l'attente est annulée et le second split ne part pas.</li></ol>",
        fastManual: "<p>Manuel – mode classique avec délai fixe :</p><ol><li>Appuyez sur Freeze Mouse dans la bonne direction puis appuyez sur le bind Fast-Feed.</li><li>Le script fait 5 splits (32 parts), attend la durée réglée sur le curseur (800ms par défaut) puis refait 5 splits (32 parts).</li></ol><p>Remarque : En mode Manuel avec une grosse masse (~800k), montez le curseur de délai vers 850ms pour éviter une division trop précoce. En mode Auto, un bon ping et des FPS stables restent importants pour le verrouillage et la précision.</p>"
      },
      de: {
        fastAutoLbl: "Auto",
        fastManLbl: "Manuell",
        fastDesc: "<p>Willst du Masse effizient in eine andere Zelle pumpen? Nutze Fast-Feed. Nur das Fenster, in dem der Bind gedrückt wurde, teilt sich. Im Menü stehen zwei Methoden zur Verfügung: Auto und Manuell (Standard ist Manuell).</p><p>Auto – Automatikmodus mit Ziel-Lock sowie Ping- und Distanzausgleich (nutzt zwei Binds, standardmäßig beide auf E):</p><ol><li>Ziel fixieren (Fixieren / Lösen) und starten (Aktivieren): Liegen beide Binds auf derselben Taste (E), zeige mit dem Cursor auf die gewünschte Zelle (Teammate, dein zweites Fenster oder jede andere Zelle außer deiner aktuellen), drücke Freeze Mouse und drücke E – das Ziel bekommt eine gelbe Umrandung samt Linie ab der Bildschirmmitte und das Script führt sofort die ersten 5 Splits (32 Teile) aus.</li><li>Getrennte Binds (optional): Legst du Fixieren / Lösen und Aktivieren auf verschiedene Tasten, kannst du mit der ersten Taste den Lock auf einem Teammate halten oder lösen und mit der zweiten Taste wiederholt füttern, ohne neu zu zielen.</li><li>Präziser 2. Split: Das Script erkennt den Start der 1. Teilung, ignoriert kleine Splitter (&lt; 15% der größten Zelle), behält den Lock bei Teilung oder Verschmelzung des Ziels, berechnet Ping samt Abstand und löst die zweiten 5 Splits (32 Teile) exakt zum Einschlag aus.</li><li>Schutz und Abbruch: Ist das Ziel zu weit weg, wartet das Script auf Annäherung; kommt das Ziel innerhalb von 3 Sekunden nicht in Reichweite, verschwindet es oder stirbst du – wird abgebrochen und der zweite Split nicht ausgelöst.</li></ol>",
        fastManual: "<p>Manuell – klassischer Modus mit fester Verzögerung:</p><ol><li>Drücke Freeze Mouse in die gewünschte Richtung und drücke den Fast-Feed-Bind.</li><li>Das Script macht 5 Splits (32 Teile), wartet die eingestellte Reglerzeit (Standard 800ms) und macht weitere 5 Splits (32 Teile).</li></ol><p>Hinweis: Bei hoher Masse (~800k) stelle im manuellen Modus den Delay-Regler auf etwa 850ms, damit der Split nicht zu früh auslöst. Im Auto-Modus bleiben ein guter Ping und stabile FPS für den Lock und das Timing wichtig.</p>"
      },
      it: {
        fastAutoLbl: "Auto",
        fastManLbl: "Manuale",
        fastDesc: "<p>Vuoi passare massa in modo efficace in un'altra cellula? Usa Fast-Feed. Si divide solo la finestra da cui è stato premuto il bind. Nel menu sono disponibili due metodi: Auto e Manuale (Manuale è predefinito).</p><p>Auto – modalità automatica con blocco del bersaglio e compensazione di ping e distanza (usa due bind, entrambi su E di default):</p><ol><li>Blocco bersaglio (Blocca / Sblocca) e avvio (Attiva): se entrambi i bind sono sullo stesso tasto (E), punta il cursore sulla cellula desiderata (un compagno, la tua seconda finestra o qualsiasi cellula tranne la tua attuale), premi Freeze Mouse e premi E – il bersaglio avrà un contorno giallo con linea dal centro e lo script farà subito i primi 5 split (32 parti).</li><li>Bind separati (opzionale): se imposti Blocca / Sblocca e Attiva su tasti diversi, con il primo tasto puoi mantenere o togliere il blocco su un compagno e con il secondo nutrirlo più volte senza doverlo ripuntare.</li><li>Tempismo preciso del 2° split: lo script rileva l'avvio della 1ª divisione, ignora le tue parti piccole (&lt; 15% della cellula più grande), mantiene il blocco se il bersaglio si divide o si unisce, calcola ping e distanza e lancia i secondi 5 split (32 parti) esattamente all'ingresso nel bersaglio.</li><li>Protezione e limite: se il bersaglio è troppo lontano, lo script attende l'avvicinamento; se entro 3 secondi non entra a portata, sparisce o muori tu – l'attesa si annulla e il secondo split non parte.</li></ol>",
        fastManual: "<p>Manuale – modalità classica a ritardo fisso:</p><ol><li>Premi Freeze Mouse nella direzione voluta e premi il bind di Fast-Feed.</li><li>Lo script fa 5 split (32 parti), aspetta il tempo impostato dallo slider (800ms predefiniti) e fa altri 5 split (32 parti).</li></ol><p>Nota: In modalità Manuale con massa elevata (~800k), alza lo slider del ritardo a circa 850ms per non dividere troppo presto. In modalità Auto restano importanti un buon ping e FPS stabili per blocco e tempismo.</p>"
      },
      pl: {
        fastAutoLbl: "Auto",
        fastManLbl: "Ręczny",
        fastDesc: "<p>Chcesz skutecznie wlać masę w inną kulkę? Użyj Fast-Feed. Dzieli się tylko to okno, z którego wciśnięto bind. W menu dostępne są dwie metody: Auto i Ręczny (domyślnie Ręczny).</p><p>Auto – tryb automatyczny z blokadą celu oraz kompensacją pingu i dystansu (używa dwóch bindów, domyślnie oba pod E):</p><ol><li>Blokada celu (Zablokuj / Odblokuj) i start (Aktywuj): jeśli oba bindy są pod tym samym klawiszem (E), najedź kursorem na wybraną kulkę (sojusznika, twoje drugie okno lub dowolną inną kulkę oprócz twojej bieżącej), wciśnij Freeze Mouse i wciśnij E – cel dostanie żółtą obwódkę z linią od środka, a skrypt od razu wykona pierwsze 5 splitów (32 części).</li><li>Rozdzielne bindy (opcjonalnie): po ustawieniu Zablokuj / Odblokuj i Aktywuj na różnych klawiszach pierwszym bindem możesz na stałe zablokować lub odblokować sojusznika, a drugim wielokrotnie wlewać w niego masę bez ponownego celowania.</li><li>Dokładny moment 2. splitu: skrypt wykrywa start 1. podziału, pomija twoje drobne kulki (&lt; 15% największej kulki), utrzymuje blokadę po podziale lub połączeniu celu, uwzględnia ping i dystans oraz odpala drugie 5 splitów (32 części) dokładnie w chwili dolotu do celu.</li><li>Zabezpieczenie i limit czasu: jeśli cel jest za daleko, skrypt poczeka na zbliżenie; jeśli w ciągu 3 sekund nie znajdzie się w zasięgu, zniknie lub zginiesz – oczekiwanie zostaje anulowane i drugi split nie następuje.</li></ol>",
        fastManual: "<p>Ręczny – klasyczny tryb ze stałym opóźnieniem:</p><ol><li>Naciśnij Freeze Mouse w odpowiednim kierunku i wciśnij bind Fast-Feeda.</li><li>Skrypt robi 5 splitów (32 części), czeka czas ustawiony suwakiem (domyślnie 800ms) i robi kolejne 5 splitów (32 części).</li></ol><p>Uwaga: W trybie Ręcznym przy dużej masie (~800k) zwiększ suwak opóźnienia do około 850ms, aby podział nie zadziałał za wcześnie. W trybie Auto do stabilnego namierzania i wyczucia czasu nadal ważny jest dobry ping i stabilne FPS.</p>"
      },
      nl: {
        fastAutoLbl: "Auto",
        fastManLbl: "Handmatig",
        fastDesc: "<p>Wil je efficiënt massa in een andere cel pompen? Gebruik Fast-Feed. Alleen het venster waarin de bind is ingedrukt splitst. Er zijn twee methodes beschikbaar in het menu: Auto en Handmatig (standaard is Handmatig).</p><p>Auto – automatische modus met doelvergrendeling en compensatie voor ping en afstand (gebruikt twee binds, beide standaard op E):</p><ol><li>Doel locken (Lock / Unlock) en starten (Activeren): staan beide binds op dezelfde toets (E), wijs met de cursor naar de gewenste cel (een teamgenoot, je tweede venster of elke cel behalve je huidige), druk op Freeze Mouse en druk op E – het doel krijgt een gele rand met een lijn vanuit het midden en het script doet direct de eerste 5 splits (32 delen).</li><li>Aparte binds (optioneel): zet je Lock / Unlock en Activeren op verschillende toetsen, dan kun je met de eerste toets de lock op een teamgenoot aan- of uitzetten en met de tweede herhaaldelijk invoeren zonder opnieuw te richten.</li><li>Exacte timing van de 2e split: het script volgt de start van de 1e splitsing, negeert kleine stukjes (&lt; 15% van je grootste cel), behoudt de lock als het doel splitst of samensmelt, rekent met ping en afstand en triggert de tweede 5 splits (32 delen) precies bij aankomst in het doel.</li><li>Beveiliging en limiet: is het doel te ver weg, dan wacht het script tot het binnen bereik komt; komt het binnen 3 seconden niet dichtbij, verdwijnt het of sterf jij – dan vervalt het wachten en gaat de tweede split niet af.</li></ol>",
        fastManual: "<p>Handmatig – klassieke modus op vaste vertraging:</p><ol><li>Druk op Freeze Mouse in de gewenste richting en druk op de Fast-Feed-bind.</li><li>Het script doet 5 splits (32 delen), wacht de ingestelde schuiftijd (standaard 800ms) en doet nog eens 5 splits (32 delen).</li></ol><p>Opmerking: Zet in Handmatig bij grote massa (~800k) de vertragingsschuif op ongeveer 850ms zodat de splitsing niet te vroeg afgaat. In Auto blijven een goede ping en stabiele FPS belangrijk voor het locken en de timing.</p>"
      },
      ro: {
        fastAutoLbl: "Auto",
        fastManLbl: "Manual",
        fastDesc: "<p>Vrei să torni masă eficient într-o altă celulă? Folosește Fast-Feed. Se împarte doar fereastra din care a fost apăsat bind-ul. În meniu sunt disponibile două metode: Auto și Manual (implicit este Manual).</p><p>Auto – mod automat cu blocare pe țintă și compensare pentru ping și distanță (folosește două bind-uri, ambele setate implicit pe E):</p><ol><li>Blocare țintă (Blochează / Debloc.) și pornire (Activează): dacă ambele bind-uri sunt pe aceeași tastă (E), pune cursorul pe celula dorită (un coechipier, a doua ta fereastră sau orice altă celulă în afară de a ta curentă), apasă Freeze Mouse și apasă E – ținta primește contur galben cu linie din centru, iar scriptul face imediat primele 5 split-uri (32 bucăți).</li><li>Bind-uri separate (opțional): dacă pui Blochează / Debloc. și Activează pe taste diferite, cu primul bind poți păstra sau scoate blocarea de pe coechipier, iar cu al doilea poți da feed repetat fără să mai pui cursorul pe el.</li><li>Moment exact pentru al 2-lea split: scriptul urmărește pornirea primei împărțiri, ignoră bucățile mici (&lt; 15% din cea mai mare celulă), păstrează blocarea dacă ținta se împarte sau se unește, ține cont de ping și distanță și declanșează următoarele 5 split-uri (32 bucăți) exact la intrarea în țintă.</li><li>Protecție și limită: dacă ținta e prea departe, scriptul așteaptă apropierea; dacă în 3 secunde nu intră în rază, dispare sau mori tu – așteptarea se anulează și al doilea split nu se execută.</li></ol>",
        fastManual: "<p>Manual – modul clasic cu întârziere fixă:</p><ol><li>Apasă Freeze Mouse în direcția dorită și apasă bind-ul de Fast-Feed.</li><li>Scriptul face 5 split-uri (32 bucăți), așteaptă timpul setat din slider (implicit 800ms) și face încă 5 split-uri (32 bucăți).</li></ol><p>Notă: În modul Manual la masă mare (~800k), mărește slider-ul de întârziere pe la 850ms ca împărțirea să nu pornească prea devreme. În modul Auto, ping-ul bun și FPS-ul stabil rămân importante pentru blocare și sincronizare.</p>"

      tr: {
        fastAutoLbl: "Oto",
        fastManLbl: "Manuel",
        fastDesc: "<p>Başka bir hücreye verimli şekilde kütle aktarmak mı istiyorsunuz? Fast-Feed kullanın. Yalnızca tuşa basılan pencere bölünür. Menüde iki yöntem bulunur: Oto ve Manuel (varsayılan Manuel).</p><p>Oto – hedef kilitlemeli, ping ve mesafe telafili otomatik mod (iki tuş kullanır, varsayılan olarak ikisi de E üzerindedir):</p><ol><li>Hedef kilitleme (Kilitle / Aç) ve başlatma (Başlat): iki tuş da aynı düğmedeyse (E), imleci istediğiniz hücrenin üzerine getirin (takım arkadaşınız, ikinci pencereniz veya mevcut hücreniz dışındaki herhangi bir hücre), Freeze Mouse tuşuna basın ve E'ye basın – hedefte merkezden gelen sarı çizgi ve halka oluşur, script anında ilk 5 bölünmeyi (32 parça) yapar.</li><li>Ayrı tuşlar (isteğe bağlı): Kilitle / Aç ve Başlat işlevlerini farklı tuşlara atarsanız, ilk tuşla kilidi takım arkadaşınızda tutabilir veya kaldırabilir, ikinci tuşla yeniden nişan almadan art arda kütle aktarabilirsiniz.</li><li>Tam 2. bölünme zamanlaması: script 1. bölünmenin başlangıcını takip eder, küçük parçalarınızı (&lt; en büyük hücrenin %15'i) yok sayar, hedef bölünse veya birleşse bile kilidi korur, ping ile mesafeyi hesaplayıp ikinci 5 bölünmeyi (32 parça) tam hedefe giriş anında uygular.</li><li>Koruma ve kesme: hedef çok uzaktaysa yaklaşmasını bekler; 3 saniye içinde menzile girmezse, hedef kaybolursa veya ölürseniz – bekleme iptal edilir ve ikinci bölünme yapılmaz.</li></ol>",
        fastManual: "<p>Manuel – sabit gecikmeli klasik mod:</p><ol><li>İstediğiniz yönde Freeze Mouse tuşuna basın ve Fast-Feed tuşuna basın.</li><li>Script 5 split (32 parça) yapar, kaydırıcıda ayarlanan süreyi (varsayılan 800ms) bekler ve 5 split (32 parça) daha yapar.</li></ol><p>Not: Manuel modda yüksek kütlede (~800k) bölünmenin erken tetiklenmemesi için gecikme kaydırıcısını yaklaşık 850ms'ye çıkarın. Oto modda da kararlı kilitleme ve zamanlama için iyi ping ve sabit FPS önemlidir.</p>"

      ar: {
        fastAutoLbl: "تلقائي",
        fastManLbl: "يدوي",
        fastDesc: "<p>هل تريد ضخ الكتلة بفعالية إلى كرة أخرى؟ استخدم Fast-Feed. تنقسم فقط النافذة التي ضغطت منها الزر. يتوفر في القائمة أسلوبان: تلقائي ويدوي (الافتراضي هو يدوي).</p><p>تلقائي – وضع آلي مع تثبيت الهدف وتعويض البينغ والمسافة (يستخدم زرين، كلاهما على E افتراضياً):</p><ol><li>تثبيت الهدف (قفل / إلغاء القفل) والتشغيل (تفعيل): إذا كان الزران على نفس المفتاح (E)، وجّه المؤشر على الخلية المطلوبة (زميلك، نافذتك الثانية، أو أي خلية عدا خليتك الحالية)، اضغط Freeze Mouse ثم اضغط E – يظهر إطار أصفر مع خط من المركز، وينفذ السكربت فوراً أول 5 انقسامات (32 جزءاً).</li><li>أزرار منفصلة (اختياري): إذا وضعت قفل / إلغاء القفل وتفعيل على مفتاحين مختلفين، يمكنك بالزر الأول تثبيت أو فك التثبيت عن زميلك مسبقاً، وبالزر الثاني التغذية نحوه بشكل متكرر دون إعادة توجيه المؤشر عليه.</li><li>توقيت الانقسام الثاني بدقة: يراقب السكربت بدء الانقسام الأول، ويتجاهل أجزاءك الصغيرة (&lt; 15% من أكبر خلية)، ويحافظ على التثبيت إذا انقسم الهدف أو اندمج، ويحسب البينغ والمسافة ليضغط الـ 5 انقسامات الثانية (32 جزءاً) لحظة الوصول للهدف.</li><li>الحماية والإلغاء: إذا كان الهدف بعيداً جداً ينتظر السكربت اقترابه، وإذا لم يدخل النطاق خلال 3 ثوانٍ أو اختفى الهدف أو متّ – يُلغى الانتظار ولا يتم الانقسام الثاني.</li></ol>",
        fastManual: "<p>يدوي – الوضع الكلاسيكي بتأخير محدد:</p><ol><li>اضغط Freeze Mouse في الاتجاه المطلوب ثم اضغط زر Fast-Feed.</li><li>يقوم السكربت بـ 5 انقسامات (32 جزءاً)، ينتظر الوقت المحدد في الشريط (الافتراضي 800ms) ثم يقوم بـ 5 انقسامات أخرى (32 جزءاً).</li></ol><p>ملاحظة: في الوضع اليدوي عند الكتلة الكبيرة (~800k) ارفع شريط التأخير إلى حوالي 850ms حتى لا يبدأ الانقسام مبكراً جداً. وفي الوضع التلقائي يظل البينغ الجيد وثبات FPS مهمين لدقة التثبيت والتوقيت.</p>"
      },
      hi: {
        fastAutoLbl: "ऑटो",
        fastManLbl: "मैनुअल",
        fastDesc: "<p>किसी दूसरी सेल में असरदार तरीके से मास डालना चाहते हैं? Fast-Feed का उपयोग करें। केवल वही विंडो स्प्लिट होगी जहाँ से बाइंड दबाया गया है। मेनू में दो तरीके उपलब्ध हैं: ऑटो और मैनुअल (डिफ़ॉल्ट मैनुअल रहता है)।</p><p>ऑटो – टारगेट लॉक और पिंग/दूरी मुआवज़े वाला स्वचालित मोड (दो बाइंड इस्तेमाल करता है, डिफ़ॉल्ट रूप से दोनों E पर हैं):</p><ol><li>टारगेट लॉक (लॉक / अनलॉक) और लॉन्च (सक्रिय करें): अगर दोनों बाइंड एक ही कुंजी (E) पर हैं, तो कर्सर को ज़रूरी सेल (टीममेट, आपकी दूसरी विंडो या आपकी मौजूदा सेल के अलावा कोई भी सेल) पर रखें, Freeze Mouse दबाएँ और E दबाएँ – टारगेट पर केंद्र से पीली लाइन और आउटलाइन आ जाएगी और स्क्रिप्ट तुरंत पहले 5 स्प्लिट (32 हिस्से) कर देगी।</li><li>अलग-अलग बाइंड (वैकल्पिक): अगर लॉक / अनलॉक और सक्रिय करें अलग कुंजियों पर रखते हैं, तो पहली कुंजी से टीममेट पर लॉक लगा या हटा सकते हैं और दूसरी से बिना दोबारा निशाना लगाए बार-बार फ़ीड कर सकते हैं।</li><li>दूसरे स्प्लिट का सटीक समय: स्क्रिप्ट पहले स्प्लिट की शुरुआत को ट्रैक करती है, आपके छोटे टुकड़ों (सबसे बड़े सेल से &lt; 15%) को अनदेखा करती है, टारगेट के स्प्लिट या मर्ज होने पर भी लॉक बनाए रखती है, और पिंग व दूरी के हिसाब से टारगेट पर पहुँचते ही दूसरे 5 स्प्लिट (32 हिस्से) कर देती है।</li><li>सुरक्षा और कटऑफ़: अगर टारगेट बहुत दूर है तो स्क्रिप्ट पास आने का इंतज़ार करेगी; अगर 3 सेकंड में पास न आए, टारगेट गायब हो जाए या आप मर जाएँ – तो इंतज़ार रद्द हो जाएगा और दूसरा स्प्लिट नहीं होगा।</li></ol>",
        fastManual: "<p>मैनुअल – तय देरी पर आधारित क्लासिक मोड:</p><ol><li>सही दिशा में Freeze Mouse दबाएँ और Fast-Feed बाइंड दबाएँ।</li><li>स्क्रिप्ट 5 स्प्लिट (32 हिस्से) करती है, स्लाइडर में तय समय (डिफ़ॉल्ट 800ms) रुकती है और फिर 5 स्प्लिट (32 हिस्से) करती है।</li></ol><p>नोट: मैनुअल मोड में ज़्यादा मास (~800k) होने पर डिले स्लाइडर को लगभग 850ms तक बढ़ा दें ताकि स्प्लिट बहुत जल्दी न हो जाए। ऑटो मोड में भी सही लॉक और टाइमिंग के लिए अच्छा पिंग और स्थिर FPS ज़रूरी हैं।</p>"
      },
      zh: {
        fastAutoLbl: "自动",
        fastManLbl: "手动",
        fastDesc: "<p>想把质量高效地灌入另一个球？请使用 Fast-Feed。只有按下快捷键的当前窗口会分裂。菜单中提供两种方法：自动和手动（默认为手动）。</p><p>自动 – 带目标锁定以及延迟和距离补偿的自动模式（使用两个按键，默认均为 E）：</p><ol><li>目标锁定（锁定 / 解锁）与启动（触发）：当两个按键都在同一键位（E）时，将光标指向目标球（队友、你的第二个窗口或除当前自身外的任意球），按下 Freeze Mouse 再按 E – 目标会出现黄色描边并从屏幕中心连出黄线，脚本立刻执行前 5 次分裂（32 份）。</li><li>分开绑定（可选）：如果将锁定 / 解锁和触发设为不同按键，可以用第一个按键提前锁定或解除队友，再用第二个按键反复喂球而无需重新对准目标。</li><li>精准第二次分裂时机：脚本会检测第一次分裂的起点，忽略较小的碎片（&lt; 最大球质量的 15%），在目标分裂或合并时继续保持锁定，结合延迟与距离在冲入目标的瞬间自动执行后 5 次分裂（32 份）。</li><li>保护与超时截断：若目标过远，脚本会等待进入可达范围；若 3 秒内未接近、目标消失或你死亡 – 等待会取消且不会触发第二次分裂。</li></ol>",
        fastManual: "<p>手动 – 按固定延迟运行的经典模式：</p><ol><li>向目标方向按下 Freeze Mouse，然后按下 Fast-Feed 快捷键。</li><li>脚本分裂 5 次（32 份），等待滑块设定的延迟时间（默认 800ms）后再分裂 5 次（32 份）。</li></ol><p>提示：在手动模式下质量很大（~800k）时，请把延迟滑块调高到约 850ms，以免过早触发分裂。在自动模式下，稳定的 FPS 和良好的网络延迟同样重要。</p>"

      ja: {
