        soloTitle: "Solo-Trick",
        soloDesc: "<p>This feature is made mainly for multiboxing with one big cell and one small cell. On the big cell, point your cursor toward the trick direction and PRESS (toggle) Freeze Mouse (or Line + Freeze Mouse). Do not hold it down, just press it, otherwise the big cell will split the other way.</p><p>Then switch to the small cell window and press the bind that fits the small cell's current mass. For example, at ~30k mass press key 7 (it is set by default, you can rebind it) (Trick 128). The small cell will instantly split 7 times (into 128 pieces) toward your cursor. At the same time, the big cell in the background will do 5 splits (32 pieces) along the frozen line, wait for the set time (Solo Delay - 800ms by default), and split another 5 times (32 pieces).</p><p>Right after pressing the bind, all you have to do is hold your normal in-game feed key so you successfully feed up for the Solo Trick. This gives you a clean solo-trick without switching tabs manually.</p>",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>Previously, we thought the game was too heavily protected, so Auto-Rev only worked through screen image analysis. It turned out that is not the case, and now two methods are available in the menu: <strong>WebSocket</strong> and <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – works directly through server data:</p><ol><li><strong>Ignores you and your teammates:</strong> when locking a target, the script filters out your own cells and your party members. You will not lock onto yourself or a teammate, even if a teammate is overlapping the enemy under your cursor.</li><li><strong>No settings changes required:</strong> works seamlessly with skins, mass display, and enemy nicknames enabled. Overlapping cells, camera movement, and zooming do not interfere with it (as long as the target stays within the <strong>SERVER</strong>'s visibility range).</li><li><strong>Instant reaction with no false triggers:</strong> Auto-Rev triggers the moment the server packet confirms the locked player split. When you die, the target dies, or the match resets, the lock is automatically cleared. Good ping and FPS are still required for consistent performance.</li></ol><p><strong>Pixi (backup visual method)</strong> – the legacy method that reads the image from the screen. It is kept in case a game update temporarily breaks WebSocket reading. Its requirements are stricter – you need consistently good FPS and ping, and also:</p><ol><li>The target must be fully visible: not covered by other cells or screen edges.</li><li>You <strong class='auto-rev-glow'>MUST</strong> turn off skins, mass display, and enemy nicknames in the game settings, otherwise false triggers will occur.</li><li>Your camera must stay still; do not zoom while locked.</li><li>This method has a ~10ms delay, but it does not depend on the game's internal code and will keep working after any updates.</li></ol><p><strong>Note:</strong> Setting more than two splits (4 pieces / 2x) is not recommended,         soloTitle: "Solo-Trick",
        soloDesc: "<p>Функция сделана в основном для игры с мультом: один большой и мелкий шары. На большом шаре наведите курсор в сторону трика и НАЖМИТЕ (toggle) Freeze Mouse (или Line + Freeze Mouse). Не зажать, а именно нажать, иначе большой шар разделится в другую сторону.</p><p>Затем перейдите в окно, где мелкий шар, нажмите бинд под текущую массу мелкого шара. Например, при массе ~30k жмите клавишу 7 (по умолчанию стоит она, можете перебиндить) (Trick 128). Мелкий шар мгновенно разделится 7 раз (на 128 частей) в сторону курсора. Одновременно большой шар в фоне сделает 5 сплитов (32 части) по замороженной линии, подождет заданное время (Solo Delay - по умолчанию 800ms) и разделится еще 5 раз (32 части).</p><p>Сразу после нажатия бинда вам остается только зажать обычную клавишу кормления из самой игры, чтобы вы успешно откормились для Solo Trick'а. Это дает чистый соло-трик без ручного переключения вкладок.</p>",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>Раньше мы думали, что игра слишком сильно защищена, поэтому авто-рев работал только через анализ картинки. Но оказалось, что это не так, и теперь в меню доступны два метода работы: <strong>WebSocket</strong> и <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – работает напрямую через данные сервера:</p><ol><li><strong>Не реагирует на вас и тиммейтов:</strong> при захвате цели скрипт отсеивает ваши шары и участников вашей пати. Вы не залочите себя или сокомандника, даже если тиммейт перекрывает врага под курсором.</li><li><strong>Не требует менять настройки:</strong> спокойно работает с включёнными скинами, показом массы и никами врагов. Ему не мешают перекрытия другими шарами, движение камеры и зум (главное, чтобы цель оставалась в зоне видимости <strong>СЕРВЕРА</strong>).</li><li><strong>Мгновенная реакция без ложных срабатываний:</strong> рев срабатывает сразу в момент получения пакета от сервера о том, что захваченный игрок разделился. При вашей смерти, смерти цели или сбросе матча захват снимается автоматически. Для стабильной работы всё так же нужны нормальные пинг и FPS.</li></ol><p><strong>Pixi (запасной визуальный способ)</strong> – старый способ, который считывает картинку с экрана. Нужен на случай, если какое-то обновление игры временно сломает чтение WebSocket. Здесь условия чуть построже – нужны стабильно хорошие FPS и пинг, а также:</p><ol><li>Цель должна быть полностью видна: не закрыта другими шарами или краями экрана.</li><li>Вы <strong class='auto-rev-glow'>ОБЯЗАНЫ</strong> выключить скины, массу и ники врагов в настройках игры, иначе будут ложные срабатывания.</li><li>Камера должна быть неподвижной, не зумите во время лока.</li><li>У этого метода есть задержка ~10ms, но он не зависит от внутреннего кода игры и продолжит работать после любых обновлений.</li></ol><p><strong>Примечание:</strong> Больше двух сплитов (4 части / 2x) ставить не рекомендуется, так как вы просто не успеете долететь до цели по физике самой игры.</p>",

        soloTitle: "Solo-Trick",
        soloDesc: "<p>Функція зроблена здебільшого для гри з мультом: одна велика й одна дрібна кулі. На великій кулі наведіть курсор у бік трюку і НАТИСНІТЬ (toggle) Freeze Mouse (або Line + Freeze Mouse). Не затиснути, а саме натиснути, інакше велика куля розділиться в інший бік.</p><p>Потім перейдіть у вікно з дрібною кулею і натисніть бінд під її поточну масу. Наприклад, при масі ~30k тисніть клавішу 7 (вона стоїть за замовчуванням, можете перебіндити) (Trick 128). Дрібна куля миттєво розділиться 7 разів (на 128 частин) у бік курсора. Одночасно велика куля у фоні зробить 5 сплітів (32 частини) по замороженій лінії, зачекає заданий час (Solo Delay - за замовчуванням 800ms) і розділиться ще 5 разів (32 частини).</p><p>Одразу після натискання бінда вам залишається лише затиснути звичайну клавішу годування з самої гри, щоб ви успішно відгодувалися для Solo Trick'а. Це дає чистий соло-трюк без ручного перемикання вкладок.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Хочете ефективно влити масу в іншу кулю? Використовуйте Fast-Feed. Натисніть Freeze Mouse у потрібному напрямку та натисніть бінд Fast-Feed'а. Ділиться лише те вікно, з якого натиснуто бінд.</p><p>Скрипт робить 5 сплітів (32 частини), чекає заданий час і робить ще 5 сплітів (32 частини). P.S. При великій масі (~800k) збільште повзунок затримки приблизно до 850ms, щоб поділ не спрацював занадто рано.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Раніше ми думали, що гра надто сильно захищена, тому авто-рев працював лише через аналіз картинки. Але виявилося, що це не так, і тепер у меню доступні два методи роботи: <strong>WebSocket</strong> та <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – працює напряму через дані сервера:</p><ol><li><strong>Не реагує на вас і тіммейтів:</strong> під час захоплення цілі скрипт відсіює ваші кулі та учасників вашої паті. Ви не залочите себе чи сокомандника, навіть якщо тіммейт перекриває ворога під курсором.</li><li><strong>Не потребує зміни налаштувань:</strong> спокійно працює з увімкненими скінами, показом маси та ніками ворогів. Йому не заважають перекриття іншими кулями, рух камери та зум (головне, щоб ціль залишалася в зоні видимості <strong>СЕРВЕРА</strong>).</li><li><strong>Миттєва реакція без хибних спрацьовувань:</strong> рев спрацьовує одразу в момент отримання пакета від сервера про те, що захоплений гравець розділився. Після вашої смерті, смерті цілі або скидання матчу захоплення знімається автоматично. Для стабільної роботи так само потрібні нормальні пінг і FPS.</li></ol><p><strong>Pixi (запасний візуальний спосіб)</strong> – старий спосіб, який зчитує картинку з екрана. Потрібен на випадок, якщо якесь оновлення гри тимчасово зламає читання WebSocket. Тут умови трохи суворіші – потрібні стабільно хороші FPS і пінг, а також:</p><ol><li>Ціль має бути повністю видимою: не закритою іншими кулями чи краями екрана.</li><li>Ви <strong class='auto-rev-glow'>ЗОБОВ'ЯЗАНІ</strong> вимкнути скіни, масу та ніки ворогів у налаштуваннях гри, інакше будуть хибні спрацьовування.</li><li>Камера повинна бути нерухомою, не зуміть під час локу.</li><li>У цього методу є затримка ~10ms, але він не залежить від внутрішнього коду гри й продовжить працювати після будь-яких оновлень.</li></ol><p><strong>Примітка:</strong> Більше двох сплітів (4 частини / 2x) ставити не рекомендується, оскільки ви просто не встигнете долетіти до цілі за фізикою самої гри.<         soloDesc: "<p>Esta función está hecha principalmente para jugar con multibox: una célula grande y una pequeña. En la célula grande, apunta el cursor hacia el lado del truco y PULSA (toggle) Freeze Mouse (o Line + Freeze Mouse). No lo mantengas pulsado, solo púlsalo, o la célula grande se dividirá hacia otro lado.</p><p>Luego pasa a la ventana de la célula pequeña y pulsa el bind según su masa actual. Por ejemplo, con ~30k de masa pulsa la tecla 7 (viene por defecto, puedes cambiarla) (Trick 128). La pequeña se dividirá 7 veces al instante (128 partes) hacia el cursor. Al mismo tiempo, la grande en segundo plano hará 5 splits (32 partes) por la línea congelada, esperará el tiempo configurado (Solo Delay - 800ms por defecto) y volverá a dividirse 5 veces (32 partes).</p><p>Justo después de pulsar el bind, solo tienes que mantener tu tecla normal de feed del juego para alimentarte bien para el Solo Trick. Esto da un solo-trick limpio sin cambiar de pestaña manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>¿Quieres pasar masa de forma eficiente a otra célula? Usa Fast-Feed. Pulsa Freeze Mouse en la dirección deseada y pulsa el bind de Fast-Feed. Solo se divide la ventana desde la que pulsaste el bind.</p><p>El script hace 5 splits (32 partes), espera el tiempo indicado y hace otros 5 splits (32 partes). P.D. Con masa alta (~800k), sube el deslizador de retraso a unos 850ms para que no se active demasiado pronto.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Antes pensábamos que el juego estaba demasiado protegido, por lo que Auto-Rev solo funcionaba analizando la imagen de la pantalla. Resultó que no es así, y ahora hay dos métodos disponibles en el menú: <strong>WebSocket</strong> y <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – funciona directamente con los datos del servidor:</p><ol><li><strong>No reacciona a ti ni a tus compañeros:</strong> al fijar un objetivo, el script descarta tus propias células y a los miembros de tu party. No fijarás ni a ti mismo ni a un compañero, incluso si este tapa al enemigo bajo el cursor.</li><li><strong>No requiere cambiar los ajustes:</strong> funciona sin problemas con las skins, la masa y los nombres enemigos activados. No le molestan otras células encima, el movimiento de cámara ni el zoom (siempre que el objetivo siga dentro del alcance de visión del <strong>SERVIDOR</strong>).</li><li><strong>Reacción instantánea sin falsos disparos:</strong> se activa en el mismo instante en que llega el paquete del servidor confirmando que el jugador fijado se ha dividido. Si tú o el objetivo morís, o si la partida se reinicia, el bloqueo se quita automáticamente. Para un rendimiento estable siguen haciendo falta un buen ping y buenos FPS.</li></ol><p><strong>Pixi (método visual de respaldo)</strong> – el método antiguo que lee la imagen de la pantalla. Sirve por si alguna actualización del juego rompe temporalmente la lectura por WebSocket. Aquí los requisitos son un poco más estrictos: necesitas FPS y ping estables, y además:</p><ol><li>El objetivo debe verse por completo: sin estar tapado por otras células ni por los bordes de la pantalla.</li><li>Estás <strong class='auto-rev-glow'>OBLIGADO</strong> a desactivar las skins, la masa y los nombres de los enemigos en los ajustes del juego, o habrá falsos disparos.</li><li>La cámara debe permanecer quieta; no hagas zoom durante el bloqueo.</li><li>Este método tiene un retardo de ~10ms, pero no depende del código interno del juego y seguirá funcionando tras cualquier actualización.</li></ol><p><strong>Nota:</strong> No se recomienda configurar más de dos splits (4 partes / 2x), ya que simplemente no llegarás a tiempo al objetivo por la propia física del juego.</p>",

        soloTitle: "Solo-Trick",
        soloDesc: "<p>Esta função foi feita principalmente para jogar de multibox: uma célula grande e uma pequena. Na célula grande, aponte o cursor para o lado do trick e APERTE (toggle) Freeze Mouse (ou Line + Freeze Mouse). Não segure, apenas aperte, senão a célula grande vai se dividir para o outro lado.</p><p>Depois vá para a janela da célula pequena e aperte o bind correspondente à massa atual dela. Por exemplo, com ~30k de massa aperte a tecla 7 (já vem por padrão, você pode rebindar) (Trick 128). A pequena vai dividir 7 vezes na hora (128 pedaços) na direção do cursor. Ao mesmo tempo, a grande em segundo plano fará 5 splits (32 pedaços) na linha congelada, aguardará o tempo definido (Solo Delay - 800ms por padrão) e dividirá mais 5 vezes (32 pedaços).</p><p>Logo após apertar o bind, basta segurar sua tecla normal de feed do jogo para se alimentar bem para o Solo Trick. Isso garante um solo-trick limpo sem trocar de abas manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Quer passar massa de forma eficiente para outra célula? Use o Fast-Feed. Aperte Freeze Mouse na direção desejada e aperte o bind do Fast-Feed. Apenas a janela de onde o bind foi pressionado será dividida.</p><p>O script faz 5 splits (32 pedaços), aguarda o tempo definido e faz mais 5 splits (32 pedaços). P.S. Com massa alta (~800k), aumente o controle de atraso para cerca de 850ms para a divisão não disparar cedo demais.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Antes achávamos que o jogo era protegido demais, então o Auto-Rev funcionava apenas analisando a imagem da tela. Mas descobrimos que não é bem assim, e agora há dois métodos disponíveis no menu: <strong>WebSocket</strong> e <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – funciona diretamente pelos dados do servidor:</p><ol><li><strong>Não reage a você nem aos aliados:</strong> ao travar o alvo, o script filtra suas próprias células e os membros da sua party. Você não vai travar em si mesmo nem em um aliado, mesmo que ele esteja por cima do inimigo sob o cursor.</li><li><strong>Não exige mudar configurações:</strong> funciona normalmente com skins, massa e nicks inimigos ativados. Sobreposição de outras células, movimento da câmera e zoom não atrapalham (desde que o alvo continue na área de visão do <strong>SERVIDOR</strong>).</li><li><strong>Reação instantânea sem falsos disparos:</strong> ativa no exato momento em que chega o pacote do servidor informando que o jogador travado se dividiu. Se você ou o alvo morrerem, ou se a partida reiniciar, a trava é removida automaticamente. Para funcionar bem, ainda são necessários bom ping e FPS estáveis.</li></ol><p><strong>Pixi (método visual reserva)</strong> – o método antigo que lê a imagem da tela. Serve caso alguma atualização do jogo quebre temporariamente a leitura via WebSocket. Aqui as condições são um pouco mais rígidas – você precisa de FPS e ping constantemente bons, além disso:</p><ol><li>O alvo deve estar totalmente visível: sem ficar coberto por outras células ou pelas bordas da tela.</li><li>Você é <strong class='auto-rev-glow'>OBRIGADO</strong> a desativar skins, massa e nicks dos inimigos nas configurações do jogo, senão haverá falsos disparos.</li><li>A câmera deve ficar parada; não dê zoom durante o lock.</li><li>Esse método tem um atraso de ~10ms, mas não depende do código interno do jogo e continuará funcionando após qualquer atualização.</li></ol><p><strong>Observação:</strong> Não é recomendado usar mais de dois splits (4 pedaços / 2x), pois você simplesmente não chegará ao alvo a tempo pela própria física do jogo.</p>",

      fr: {
        alert: "Ce script ne fonctionnera dans aucun navigateur russe.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Cette fonction est surtout conçue pour le jeu en multibox : une grande cellule et une petite. Sur la grande cellule, pointez le curseur vers la direction du trick et APPUYEZ (toggle) sur Freeze Mouse (ou Line + Freeze Mouse). Ne maintenez pas la touche, appuyez juste dessus, sinon la grande cellule se divisera dans une autre direction.</p><p>Passez ensuite sur la fenêtre de la petite cellule et appuyez sur le bind adapté à sa masse actuelle. Par exemple, vers ~30k de masse, appuyez sur la touche 7 (par défaut, vous pouvez la rebind) (Trick 128). La petite cellule se divisera instantanément 7 fois (128 parts) vers le curseur. En même temps, la grande cellule en arrière-plan fera 5 splits (32 parts) sur la ligne gelée, attendra le délai réglé (Solo Delay - 800ms par défaut) puis se divisera encore 5 fois (32 parts).</p><p>Juste après avoir appuyé sur le bind, il ne vous reste qu'à maintenir votre touche normale de feed du jeu pour bien alimenter le Solo Trick. Cela donne un solo-trick propre sans changer d'onglet à la main.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Vous voulez envoyer efficacement de la masse dans une autre cellule ? Utilisez Fast-Feed. Appuyez sur Freeze Mouse dans la bonne direction puis appuyez sur le bind Fast-Feed. Seule la fenêtre depuis laquelle le bind est pressé se divisera.</p><p>Le script fait 5 splits (32 parts), attend le délai défini et refait 5 splits (32 parts). P.S. Avec une grosse masse (~800k), montez le curseur de délai vers 850ms pour éviter que la division ne parte trop tôt.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Nous pensions auparavant que le jeu était trop protégé, donc Auto-Rev fonctionnait uniquement par analyse d'image. Il s'est avéré que ce n'est pas le cas, et deux méthodes sont désormais disponibles dans le menu : <strong>WebSocket</strong> et <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – fonctionne directement via les données du serveur :</p><ol><li><strong>Ne réagit ni à vous ni à vos coéquipiers :</strong> lors du verrouillage, le script exclut vos propres cellules et les membres de votre party. Vous ne verrouillerez ni vous-même ni un allié, même si un coéquipier recouvre l'ennemi sous le curseur.</li><li><strong>Aucun réglage à modifier :</strong> fonctionne sans souci avec les skins, l'affichage de la masse et les pseudos ennemis activés. Les cellules superposées, les mouvements de caméra et le zoom ne le gênent pas (tant que la cible reste dans la zone de visibilité du <strong>SERVEUR</strong>).</li><li><strong>Réaction instantanée sans faux déclenchements :</strong> se déclenche dès réception du paquet serveur indiquant que le joueur verrouillé s'est divisé. Si vous mourez, si la cible meurt ou si la partie est réinitialisée, le verrouillage se retire automatiquement. Un bon ping et de bons FPS restent nécessaires pour un fonctionnement stable.</li></ol><p><strong>Pixi (méthode visuelle de secours)</strong> – l'ancienne méthode qui lit l'image à l'écran. Utile si une mise à jour du jeu casse temporairement la lecture WebSocket. Ici, les conditions sont un peu plus strictes – il faut des FPS et un ping constamment bons, ainsi que :</p><ol><li>La cible doit être entièrement visible : ni masquée par d'autres cellules ni coupée par les bords de l'écran.</li><li>Vous êtes <strong class='auto-rev-glow'>OBLIGÉ</strong> de désactiver les skins, la masse et les pseudos ennemis dans les paramètres du jeu, sinon il y aura de faux déclenchements.</li><li>La caméra doit rester immobile ; ne zoomez pas pendant le verrouillage.</li><li>Cette méthode a un délai d'environ 10ms, mais ne dépend pas du code interne du jeu et continuera de fonctionner après toute mise à jour.</li></ol><p><strong>Remarque :</strong> Il est déconseillé de mettre plus de deux splits (4 parts / 2x), car vous n'atteindrez tout simplement pas la cible à temps à cause de la physique même du jeu.</p>",

      de: {
        alert: "Dieses Script wird in keinem russischen Browser funktionieren.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Diese Funktion ist hauptsächlich für das Spielen mit Multibox gedacht: eine große und eine kleine Zelle. Zeige auf der großen Zelle mit dem Cursor in Trick-Richtung und DRÜCKE (toggle) Freeze Mouse (oder Line + Freeze Mouse). Nicht gedrückt halten, sondern kurz drücken, sonst teilt sich die große Zelle in die falsche Richtung.</p><p>Wechsle danach ins Fenster der kleinen Zelle und drücke den Bind für ihre aktuelle Masse. Bei ca. ~30k Masse drücke z.B. Taste 7 (ist standardmäßig belegt, kannst du umbelegen) (Trick 128). Die kleine Zelle teilt sich sofort 7-mal (128 Teile) Richtung Cursor. Gleichzeitig macht die große Zelle im Hintergrund 5 Splits (32 Teile) entlang der eingefrorenen Linie, wartet die eingestellte Zeit (Solo Delay - Standard 800ms) und teilt sich erneut 5-mal (32 Teile).</p><p>Direkt nach dem Drücken musst du nur noch deine normale Ingame-Feed-Taste gedrückt halten, um für den Solo Trick sauber zu füttern. Das ergibt einen sauberen Solo-Trick ohne manuelles Tab-Wechseln.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Willst du Masse effizient in eine andere Zelle pumpen? Nutze Fast-Feed. Drücke Freeze Mouse in die gewünschte Richtung und drücke den Fast-Feed-Bind. Nur das Fenster, in dem der Bind gedrückt wurde, teilt sich.</p><p>Das Script macht 5 Splits (32 Teile), wartet die eingestellte Zeit und macht weitere 5 Splits (32 Teile). P.S. Bei hoher Masse (~800k) stelle den Delay-Regler auf etwa 850ms, damit der Split nicht zu früh auslöst.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Früher dachten wir, das Spiel sei zu stark geschützt, weshalb Auto-Rev nur über Bildanalyse funktionierte. Es stellte sich heraus, dass dem nicht so ist, und jetzt stehen im Menü zwei Methoden zur Verfügung: <strong>WebSocket</strong> und <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – arbeitet direkt mit den Serverdaten:</p><ol><li><strong>Reagiert nicht auf dich und Teammates:</strong> Beim Fixieren filtert das Script deine eigenen Zellen und deine Party-Mitglieder heraus. Du fixierst weder dich selbst noch einen Mitspieler, selbst wenn ein Teammate den Gegner unter dem Cursor verdeckt.</li><li><strong>Keine Einstellungsänderungen nötig:</strong> Funktioniert problemlos mit aktivierten Skins, Massenanzeige und gegnerischen Namen. Überlappende Zellen, Kamerabewegungen und Zoomen stören nicht (solange das Ziel im Sichtbereich des <strong>SERVERS</strong> bleibt).</li><li><strong>Sofortige Reaktion ohne Fehlauslösungen:</strong> Löst exakt in dem Moment aus, in dem das Serverpaket über die Teilung des fixierten Spielers eintrifft. Stirbst du, stirbt das Ziel oder wird das Match zurückgesetzt, wird der Lock automatisch aufgehoben. Für einen stabilen Betrieb sind weiterhin guter Ping und stabile FPS nötig.</li></ol><p><strong>Pixi (visuelle Backup-Methode)</strong> – die alte Methode, die das Bild vom Bildschirm ausliest. Nützlich, falls ein Spiel-Update das Auslesen per WebSocket vorübergehend unterbricht. Hier sind die Bedingungen etwas strenger – erforderlich sind konstant gute FPS und niedriger Ping sowie:</p><ol><li>Das Ziel muss vollständig sichtbar sein: weder von anderen Zellen noch vom Bildschirmrand verdeckt.</li><li>Du <strong class='auto-rev-glow'>MUSST</strong> Skins, Masse und gegnerische Namen in den Spieleinstellungen deaktivieren, sonst kommt es zu Fehlauslösungen.</li><li>Die Kamera muss ruhig bleiben; zoome während des Locks nicht.</li><li>Diese Methode hat eine Verzögerung von ~10ms, hängt aber nicht vom internen Spielcode ab und funktioniert nach jedem Update weiter.</li></ol><p><strong>Hinweis:</strong> Mehr als zwei Splits (4 Teile / 2x) einzustellen wird nicht empfohlen, da du das Ziel aufgrund der Spielphysik schlicht nicht rechtzeitig erreichst.</p>",

      it: {
        alert: "Questo script non funzionerà in nessun browser russo.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Questa funzione è pensata principalmente per giocare in multibox: una cellula grande e una piccola. Sulla cellula grande punta il cursore nella direzione del trick e PREMI (toggle) Freeze Mouse (o Line + Freeze Mouse). Non tenere premuto, premi e basta, altrimenti la cellula grande si dividerà da un'altra parte.</p><p>Poi passa alla finestra della cellula piccola e premi il bind adatto alla sua massa attuale. Ad esempio, con ~30k di massa premi il tasto 7 (è impostato di default, puoi cambiarlo) (Trick 128). La piccola si dividerà subito 7 volte (128 parti) verso il cursore. Allo stesso tempo la grande in background farà 5 split (32 parti) lungo la linea bloccata, aspetterà il tempo impostato (Solo Delay - 800ms predefiniti) e si dividerà altre 5 volte (32 parti).</p><p>Subito dopo aver premuto il bind, ti resta solo da tenere premuto il tasto normale di feed del gioco per nutrirti con successo per il Solo Trick. Questo ti dà un solo-trick pulito senza cambiare scheda manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Vuoi passare massa in modo efficace in un'altra cellula? Usa Fast-Feed. Premi Freeze Mouse nella direzione voluta e premi il bind di Fast-Feed. Si divide solo la finestra da cui è stato premuto il bind.</p><p>Lo script fa 5 split (32 parti), aspetta il tempo impostato e fa altri 5 split (32 parti). P.S. Con massa elevata (~800k) aumenta lo slider del ritardo a circa 850ms per non far partire la divisione troppo presto.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Prima pensavamo che il gioco fosse troppo protetto, quindi Auto-Rev funzionava solo tramite l'analisi dell'immagine sullo schermo. Si è scoperto che non è così, e ora nel menu sono disponibili due metodi: <strong>WebSocket</strong> e <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – lavora direttamente attraverso i dati del server:</p><ol><li><strong>Non reagisce a te e ai compagni:</strong> durante il blocco del bersaglio, lo script esclude le tue cellule e i membri del tuo party. Non bloccherai mai te stesso o un compagno, nemmeno se quest'ultimo copre il nemico sotto il cursore.</li><li><strong>Non richiede di cambiare impostazioni:</strong> funziona tranquillamente con skin, massa e nomi nemici attivi. Sovrapposizioni con altre cellule, movimenti della visuale e zoom non lo disturbano (purché il bersaglio resti nella zona visibile del <strong>SERVER</strong>).</li><li><strong>Reazione istantanea senza falsi scatti:</strong> si attiva nel momento esatto in cui arriva il pacchetto dal server che conferma la divisione del giocatore bloccato. Se muori tu, muore il bersaglio o la partita si resetta, il blocco si toglie automaticamente. Per una resa stabile servono comunque un buon ping e FPS regolari.</li></ol><p><strong>Pixi (metodo visivo di riserva)</strong> – il vecchio metodo che legge l'immagine dallo schermo. Serve nel caso in cui un aggiornamento del gioco comprometta temporaneamente la lettura WebSocket. Qui le condizioni sono un po' più rigide – servono FPS e ping costantemente buoni, e inoltre:</p><ol><li>Il bersaglio deve essere visibile per intero: non coperto da altre cellule o dai bordi dello schermo.</li><li>Sei <strong class='auto-rev-glow'>OBBLIGATO</strong> a disattivare skin, massa e nomi nemici nelle impostazioni di gioco, altrimenti ci saranno falsi scatti.</li><li>La visuale deve restare ferma; non fare zoom durante il lock.</li><li>Questo metodo ha un ritardo di ~10ms, ma non dipende dal codice interno del gioco e continuerà a funzionare dopo qualsiasi aggiornamento.</li></ol><p><strong>Nota:</strong> Non è consigliabile impostare più di due split (4 parti / 2x), perché per la fisica stessa del gioco non faresti semplicemente in tempo a raggiungere il bersaglio.</p>",
        noVideo: "Video non disponibile",
        codeLink: "Codice attuale"
      },
      pl: {
        alert: "Ten skrypt nie będzie działać w żadnej rosyjskiej przeglądarce.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Funkcja stworzona głównie do gry z multiboxem: jedna duża i jedna mała kulka. Na dużej kulce nakieruj kursor w stronę tricka i NACIŚNIJ (toggle) Freeze Mouse (lub Line + Freeze Mouse). Nie przytrzymuj, tylko naciśnij, inaczej duża kulka podzieli się w inną stronę.</p><p>Następnie przejdź do okna z małą kulką i wciśnij bind dobrany do jej aktualnej masy. Na przykład przy masie ~30k wciśnij klawisz 7 (jest domyślny, możesz go zmienić) (Trick 128). Mała kulka natychmiast podzieli się 7 razy (na 128 części) w stronę kursora. Jednocześnie duża w tle zrobi 5 splitów (32 części) po zamrożonej linii, odczeka ustawiony czas (Solo Delay - domyślnie 800ms) i podzieli się kolejne 5 razy (32 części).</p><p>Zaraz po wciśnięciu binda wystarczy przytrzymać zwykły klawisz karmienia w grze, aby skutecznie nakarmić się pod Solo Tricka. Daje to czysty solo-trick bez ręcznego przełączania kart.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Chcesz skutecznie wlać masę w inną kulkę? Użyj Fast-Feed. Naciśnij Freeze Mouse w odpowiednim kierunku i wciśnij bind Fast-Feeda. Dzieli się tylko to okno, z którego wciśnięto bind.</p><p>Skrypt robi 5 splitów (32 części), czeka ustawiony czas i robi kolejne 5 splitów (32 części). P.S. Przy dużej masie (~800k) zwiększ suwak opóźnienia do około 850ms, aby podział nie zadziałał za wcześnie.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Wcześniej sądziliśmy, że gra jest zbyt mocno zabezpieczona, dlatego auto-rev działał wyłącznie przez analizę obrazu. Okazało się jednak, że tak nie jest, i teraz w menu są dostępne dwie metody działania: <strong>WebSocket</strong> oraz <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – działa bezpośrednio na danych z serwera:</p><ol><li><strong>Nie reaguje na ciebie i sojuszników:</strong> przy namierzaniu celu skrypt odfiltrowuje twoje kulki oraz członków twojego party. Nie zablokujesz siebie ani sojusznika, nawet jeśli kolega z drużyny zasłania wroga pod kursorem.</li><li><strong>Nie wymaga zmian w ustawieniach:</strong> bez problemu działa z włączonymi skinami, pokazywaniem masy i nickami wrogów. Nie przeszkadzają mu nachodzące na siebie kulki, ruch kamery ani zoom (ważne tylko, aby cel pozostawał w zasięgu widoczności <strong>SERWERA</strong>).</li><li><strong>Natychmiastowa reakcja bez fałszywych zadziałań:</strong> rev odpala się w chwili otrzymania pakietu z serwera o podziale namierzonego gracza. Gdy zginiesz ty, zginie cel lub mecz zostanie zresetowany, blokada zdejmuje się automatycznie. Do stabilnego działania nadal potrzebny jest dobry ping i FPS.</li></ol><p><strong>Pixi (zapasowy tryb wizualny)</strong> – starsza metoda sczytująca obraz z ekranu. Przydaje się na wypadek, gdyby aktualizacja gry tymczasowo popsuła odczyt WebSocket. Tutaj warunki są nieco ostrzejsze – potrzebne są stabilnie wysokie FPS i niski ping, a ponadto:</p><ol><li>Cel musi być w pełni widoczny: niezasłonięty przez inne kulki ani krawędzie ekranu.</li><li>Jesteś <strong class='auto-rev-glow'>ZOBOWIĄZANY</strong> wyłączyć skiny, masę i nicki wrogów w ustawieniach gry, w przeciwnym razie wystąpią fałszywe reakcje.</li><li>Kamera musi być nieruchoma, nie przybliżaj ani nie oddalaj podczas locka.</li><li>Ta metoda ma opóźnienie ~10ms, ale nie zależy od wewnętrznego kodu gry i będzie działać po kolejnych aktualizacjach.</li></ol><p><strong>Uwaga:</strong> Nie zaleca się ustawiania więcej niż dwóch splitów (4 części / 2x), ponieważ przez samą fizykę gry po prostu nie zdążysz dolecieć do celu.</p>",

      },

        soloDesc: "<p>Deze functie is vooral gemaakt voor multiboxen: één grote en één kleine cel. Richt op de grote cel de cursor richting de trick en DRUK (toggle) op Freeze Mouse (of Line + Freeze Mouse). Niet ingedrukt houden, maar indrukken, anders splitst de grote cel de andere kant op.</p><p>Ga daarna naar het venster met de kleine cel en druk op de bind die past bij de huidige massa ervan. Druk bijvoorbeeld bij ~30k massa op toets 7 (staat standaard ingesteld, kun je aanpassen) (Trick 128). De kleine cel splitst direct 7 keer (128 delen) richting je cursor. Tegelijk doet de grote cel op de achtergrond 5 splits (32 delen) langs de bevroren lijn, wacht de ingestelde tijd (Solo Delay - standaard 800ms) en splitst nog eens 5 keer (32 delen).</p><p>Direct na het indrukken van de bind hoef je alleen je normale feed-toets uit het spel ingedrukt te houden om goed te voeren voor de Solo Trick. Dat geeft een strakke solo-trick zonder handmatig tabbladen te wisselen.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Wil je efficiënt massa in een andere cel pompen? Gebruik Fast-Feed. Druk op Freeze Mouse in de gewenste richting en druk op de Fast-Feed-bind. Alleen het venster waarin de bind is ingedrukt splitst.</p><p>Het script doet 5 splits (32 delen), wacht de ingestelde tijd en doet nog eens 5 splits (32 delen). P.S. Zet bij grote massa (~800k) de vertragingsschuif op ongeveer 850ms zodat de splitsing niet te vroeg afgaat.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Eerder dachten we dat de game te streng beveiligd was, waardoor Auto-Rev alleen via beeldanalyse werkte. Dat bleek mee te vallen, en nu zijn er twee methodes beschikbaar in het menu: <strong>WebSocket</strong> en <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – werkt rechtstreeks via servergegevens:</p><ol><li><strong>Reageert niet op jou of teamgenoten:</strong> bij het locken filtert het script je eigen cellen en je party-leden eruit. Je lockt nooit op jezelf of een teamgenoot, zelfs niet als een teamgenoot de vijand onder je cursor overlapt.</li><li><strong>Geen instellingen aanpassen nodig:</strong> werkt probleemloos met skins, massaweergave en vijandelijke namen ingeschakeld. Overlappende cellen, camerabewegingen en zoomen hinderen hem niet (zolang het doel binnen het zichtbereik van de <strong>SERVER</strong> blijft).</li><li><strong>Directe reactie zonder valse triggers:</strong> gaat direct af op het moment dat het serverpakket binnenkomt dat de gelockte speler is gesplitst. Als jij sterft, het doel sterft of de match reset, vervalt de lock automatisch. Voor stabiele werking blijven goede ping en FPS nodig.</li></ol><p><strong>Pixi (visuele back-upmethode)</strong> – de oude methode die het beeld van het scherm uitleest. Handig voor het geval een game-update het uitlezen via WebSocket tijdelijk breekt. Hier zijn de eisen iets strenger – je hebt constant goede FPS en ping nodig, en ook:</p><ol><li>Het doel moet volledig zichtbaar zijn: niet bedekt door andere cellen of schermranden.</li><li>Je bent <strong class='auto-rev-glow'>VERPLICHT</strong> om skins, massa en vijandelijke namen uit te zetten in de spelinstellingen, anders krijg je valse triggers.</li><li>De camera moet stil blijven staan; zoom niet tijdens een lock.</li><li>Deze methode heeft ~10ms vertraging, maar hangt niet af van de interne gamecode en blijft na updates gewoon werken.</li></ol><p><strong>Opmerking:</strong> Meer dan twee splits (4 delen / 2x) instellen wordt afgeraden, omdat je het doel door de fysica van de game simpelweg niet op tijd bereikt.</p>",

        autoTitle: "Auto-Rev",

.</li></ol><p><strong>Notă:</strong> Nu este recomandat să pui mai mult de două split-uri (4 bucăți / 2x), deoarece pur și simplu nu vei ajunge la timp la țintă din cauza fizicii jocului.</p>",

        soloTitle: "Solo-Trick",
        soloDesc: "<p>هذه الميزة مصممة أساسًا للعب بالمالتي بوكس: كرة كبيرة وكرة صغيرة. على الكرة الكبيرة وجّه المؤشر نحو اتجاه التريك واضغط (toggle) على Freeze Mouse (أو Line + Freeze Mouse). لا تضغط باستمرار بل اضغط فقط، وإلا ستنقسم الكرة الكبيرة في اتجاه آخر.</p><p>بعد ذلك انتقل إلى نافذة الكرة الصغيرة واضغط الزر المناسب لكتلتها الحالية. مثلاً عند كتلة ~30k اضغط المفتاح 7 (هذا هو الافتراضي، ويمكنك تغييره) (Trick 128). ستنقسم الكرة الصغيرة فوراً 7 مرات (128 جزءاً) نحو المؤشر. وفي الوقت نفسه ستقوم الكرة الكبيرة في الخلفية بـ 5 انقسامات (32 جزءاً) على الخط المجمد، وتنتظر الوقت المحدد (Solo Delay - الافتراضي 800ms) ثم تنقسم 5 مرات أخرى (32 جزءاً).</p><p>مباشرة بعد الضغط على الزر، ما عليك سوى الضغط باستمرار على زر التغذية العادي في اللعبة لتتغذى بنجاح من أجل Solo Trick. هذا يمنحك سولو تريك نظيفاً بدون تبديل النوافذ يدوياً.</p>",
        fastTitle: "Fast-Feed",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>في السابق كنا نظن أن اللعبة محمية بشكل مبالغ فيه، لذلك كان Auto-Rev يعمل فقط عبر تحليل صورة الشاشة. لكن اتضح أن الأمر ليس كذلك، والآن يتوفر في القائمة أسلوبان للعمل: <strong>WebSocket</strong> و<strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – يعمل مباشرة عبر بيانات السيرفر:</p><ol><li><strong>لا يتفاعل معك أو مع زملائك في الفريق:</strong> عند تثبيت الهدف يستبعد السكربت كراتك وأعضاء مجموعتك (البارتي). لن تثبّت على نفسك أو على زميلك حتى لو كان يغطي الخصم تحت المؤشر.</li><li><strong>لا يتطلب تغيير الإعدادات:</strong> يعمل بسلاسة مع تفعيل السكينات وإظهار الكتلة وأسماء الخصوم. لا يؤثر عليه تداخل الكرات الأخرى أو حركة الكاميرا أو التكبير والتصغير (الأهم أن يبقى الهدف ضمن نطاق رؤية <strong>السيرفر</strong>).</li><li><strong>استجابة فورية بدون تفعيلات خاطئة:</strong> ينطلق في لحظة وصول حزمة السيرفر التي تفيد بانقسام اللاعب المثبّت. عند موتك أو موت الهدف أو إعادة ضبط المباراة يُزال التثبيت تلقائياً. ولأداء مستقر لا يزال يلزم بينغ جيد وFPS ثابت.</li></ol><p><strong>Pixi (طريقة بصرية احتياطية)</strong> – الطريقة القديمة التي تقرأ الصورة من الشاشة. توجد في حال تسبب تحديث للعبة بتعطيل قراءة WebSocket مؤقتاً. هنا الشروط أكثر صرامة قليلاً – تحتاج إلى FPS وبينغ جيدين باستمرار، وأيضاً:</p><ol><li>يجب أن يكون الهدف مرئياً بالكامل: غير مغطى بكرات أخرى أو بحواف الشاشة.</li><li>أنت <strong class='auto-rev-glow'>مُلزم</strong> بإيقاف السكينات والكتلة وأسماء الخصوم في إعدادات اللعبة، وإلا فستحدث استجابات خاطئة.</li><li>يجب أن تبقى الكاميرا ثابتة، ولا تقم بالتكبير أو التصغير أثناء القفل.</li><li>يوجد في هذه الطريقة تأخير ~10ms، لكنها لا تعتمد على الكود الداخلي للعبة وستواصل العمل بعد أي تحديثات.</li></ol><p><strong>ملاحظة:</strong> لا يُنصح بوضع أكثر من انقسامين (4 أجزاء / 2x)، لأنك ببساطة لن تلحق بالوصول إلى الهدف بسبب فيزياء اللعبة نفسها.</p>",

        soloTitle: "Solo-Trick",
        soloDesc: "<p>यह फीचर मुख्य रूप से मल्टीबॉक्स खेलने के लिए बनाया गया है: एक बड़ी और एक छोटी सेल। बड़ी सेल पर कर्सर को ट्रिक की दिशा में रखें और Freeze Mouse (या Line + Freeze Mouse) को दबाएँ (toggle)। दबाकर न रखें, बस एक बार दबाएँ, वरना बड़ी सेल दूसरी दिशा में स्प्लिट हो जाएगी।</p><p>फिर छोटी सेल वाली विंडो में जाएँ और उसकी मौजूदा मास के हिसाब से बाइंड दबाएँ। उदाहरण के लिए, ~30k मास पर कुंजी 7 दबाएँ (यह डिफ़ॉल्ट है, आप इसे रीबाइंड कर सकते हैं) (Trick 128)। छोटी सेल तुरंत कर्सर की ओर 7 बार (128 हिस्सों में) स्प्लिट हो जाएगी। उसी समय बैकग्राउंड में बड़ी सेल फ़्रोज़न लाइन पर 5 स्प्लिट (32 हिस्से) करेगी, तय समय (Solo Delay - डिफ़ॉल्ट 800ms) का इंतज़ार करेगी और फिर 5 बार (32 हिस्से) स्प्लिट होगी।</p><p>बाइंड दबाने के तुरंत बाद आपको बस गेम की सामान्य फ़ीड कुंजी दबाए रखनी है ताकि आप Solo Trick के लिए सही से फ़ीड कर सकें। इससे बिना मैन्युअल टैब बदले साफ़ सोलो-ट्रिक होता है।</p>",

        fastDesc: "<p>किसी दूसरी सेल में तेज़ी और असरदार तरीके से मास डालना चाहते हैं? Fast-Feed का उपयोग करें। सही दिशा में Freeze Mouse दबाएँ और Fast-Feed बाइंड दबाएँ। केवल वही विंडो स्प्लिट होगी जहाँ से बाइंड दबाया गया है।</p><p>स्क्रिप्ट 5 स्प्लिट (32 हिस्से) करती है, तय समय तक रुकती है और फिर 5 स्प्लिट (32 हिस्से) करती है। नोट: बड़ी मास (~800k) पर डिले स्लाइडर को लगभग 850ms तक बढ़ा दें ताकि स्प्लिट बहुत जल्दी न हो जाए।</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>पहले हमें लगता था कि गेम बहुत ज़्यादा सुरक्षित है, इसलिए Auto-Rev सिर्फ़ स्क्रीन की इमेज के विश्लेषण से काम करता था। लेकिन ऐसा नहीं निकला, और अब मेनू में काम करने के दो तरीके उपलब्ध हैं: <strong>WebSocket</strong> और <strong>Pixi</strong>।</p><p><strong>WebSocket</strong> – सीधे सर्वर डेटा के ज़रिए काम करता है:</p><ol><li><strong>आप और टीममेट्स पर रिएक्ट नहीं करता:</strong> टारगेट लॉक करते समय स्क्रिप्ट आपकी अपनी सेल्स और आपकी पार्टी के सदस्यों को अलग कर देती है। आप खुद को या टीममेट को लॉक नहीं करेंगे, भले ही टीममेट कर्सर के नीचे दुश्मन को ढक रहा हो।</li><li><strong>सेटिंग्स बदलने की ज़रूरत नहीं:</strong> स्किन, मास डिस्प्ले और दुश्मनों के नाम चालू होने पर भी आराम से काम करता है। दूसरी सेल्स के ऊपर आने, कैमरा हिलने और ज़ूम करने से इस पर फ़र्क नहीं पड़ता (बस टारगेट <strong>सर्वर</strong> की विज़िबिलिटी रेंज में रहना चाहिए)।</li><li><strong>बिना गलत ट्रिगर के तुरंत रिएक्शन:</strong> जैसे ही सर्वर से पैकेट आता है कि लॉक किया गया खिलाड़ी स्प्लिट हुआ है, उसी पल यह ट्रिगर हो जाता है। आपके मरने, टारगेट के मरने या मैच रीसेट होने पर लॉक अपने आप हट जाता है। स्थिर काम के लिए अच्छा पिंग और FPS अब भी ज़रूरी हैं।</li></ol><p><strong>Pixi (बैकअप विज़ुअल तरीका)</strong> – पुराना तरीका, जो स्क्रीन से तस्वीर पढ़ता है। यह इस स्थिति के लिए है अगर गेम का कोई अपडेट अस्थायी रूप से WebSocket रीडिंग को तोड़ दे। यहाँ शर्तें थोड़ी ज़्यादा सख़्त हैं – लगातार अच्छे FPS और पिंग चाहिए, और साथ ही:</p><ol><li>टारगेट पूरी तरह दिखना चाहिए: दूसरी सेल्स या स्क्रीन के किनारों से ढका नहीं होना चाहिए।</li><li>आपको गेम सेटिंग्स में स्किन, मास और दुश्मनों के नाम बंद करना <strong class='auto-rev-glow'>अनिवार्य</strong> है, वरना गलत ट्रिगर होंगे।</li><li>कैमरा स्थिर रहना चाहिए, लॉक के दौरान ज़ूम न करें।</li><li>इस तरीके में ~10ms की देरी है, लेकिन यह गेम के अंदरूनी कोड पर निर्भर नहीं है और किसी भी अपडेट के बाद चलता रहेगा।</li></ol><p><strong>नोट:</strong> दो स्प्लिट (4 हिस्से / 2x) से ज़्यादा रखने की सलाह नहीं दी जाती, क्योंकि गेम की अपनी फ़िज़िक्स की वजह से आप बस समय पर टारगेट तक पहुँच ही नहीं पाएँगे।</p>",

        soloDesc: "<p>此功能主要用于多开玩法：一个大球和一个小球。在大球窗口中将光标指向技巧方向并按下（toggle）Freeze Mouse（或 Line + Freeze Mouse）。不要长按，只需按一下开启，否则大球会往反方向分裂。</p><p>随后切换到小球窗口，按下对应小球当前质量的快捷键。例如约 ~30k 质量时按 7 键（这是默认键位，可以自行改键）(Trick 128)。小球会立刻向光标方向分裂 7 次（128 份）。同时后台的大球会沿着锁定路线分裂 5 次（32 份），等待设定时间（Solo Delay - 默认 800ms）后再分裂 5 次（32 份）。</p><p>按下快捷键后只需按住游戏自带的喂球键，即可顺利完成 Solo Trick 的喂球。全程无需手动切换标签页。</p>",

        autoTitle: "Auto-Rev",
        autoDesc: "<p>以前我们以为游戏保护得太严，所以 Auto-Rev 只能通过画面图像分析来工作。但事实并非如此，现在菜单中提供了两种工作方式：<strong>WebSocket</strong> 和 <strong>Pixi</strong>。</p><p><strong>WebSocket</strong> – 直接通过服务器数据工作：</p><ol><li><strong>不会误锁自己和队友：</strong>锁定目标时，脚本会过滤掉你自己的球以及你的组队成员。即使队友刚好挡在光标下的敌人上面，你也不会锁到自己或队友。</li><li><strong>无需修改游戏设置：</strong>开启皮肤、质量显示和敌方昵称时也能正常使用。其他球遮挡、镜头移动和缩放都不会影响它（只要目标仍在<strong>服务器</strong>可见范围内即可）。</li><li><strong>瞬时响应且无误触发：</strong>一旦收到目标玩家分裂的服务器数据包就会立刻触发。当你死亡、目标死亡或对局重置时，锁定会自动解除。为了稳定运行，仍需要良好的延迟和 FPS。</li></ol><p><strong>Pixi（备用视觉方式）</strong> – 从屏幕读取画面的旧方式。用于在游戏更新暂时破坏 WebSocket 读取时作为备选。这里的条件更严格一些 – 需要持续稳定的高 FPS 和低延迟，同时：</p><ol><li>目标必须完全可见：不能被其他球或屏幕边缘遮挡。</li><li>您<strong class='auto-rev-glow'>必须</strong>在游戏设置中关闭皮肤、质量和敌方昵称，否则会出现误触发。</li><li>视角必须保持静止，锁定期间不要缩放。</li><li>该方式约有 ~10ms 延迟，但它不依赖游戏内部代码，后续任何更新都能继续使用。</li></ol><p><strong>注意：</strong>不建议设置超过两次分裂（4 份 / 2x），因为按照游戏本身的物理机制，你根本来不及飞到目标位置。</p>",

      ko: {

        soloTitle: "Solo-Trick",

        fastTitle: "Fast-Feed",
        fastDesc: "<p>다른 셀에 효율적으로 매스를 몰아주고 싶다면 Fast-Feed를 사용하세요. 원하는 방향에서 Freeze Mouse를 누른 뒤 Fast-Feed 바인드를 누르면 됩니다. 바인드를 누른 창만 분열합니다.</p><p>스크립트가 5번(32조각) 분열하고 설정된 시간만큼 기다린 뒤 다시 5번(32조각) 분열합니다. 참고: 매스가 클 때(~800k)는 분열이 너무 빨리 터지지 않도록 딜레이 슬라이더를 약 850ms로 높여 주세요.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>예전에는 게임 보안이 너무 강하다고 생각해 Auto-Rev가 화면 이미지 분석 방식으로만 작동했습니다. 하지만 그렇지 않다는 것이 밝혀졌고, 이제 메뉴에서 <strong>WebSocket</strong>과 <strong>Pixi</strong> 두 가지 방식을 사용할 수 있습니다.</p><p><strong>WebSocket</strong> – 서버 데이터를 통해 직접 작동합니다:</p><ol><li><strong>본인과 팀원에게는 반응하지 않음:</strong> 대상을 고정할 때 내 셀과 파티원을 걸러냅니다. 팀원이 커서 아래의 적을 가리고 있더라도 본인이나 팀원이 락 걸리지 않습니다.</li><li><strong>설정 변경 불필요:</strong> 스킨, 매스 표시, 적 닉네임이 켜져 있어도 무리 없이 작동합니다. 다른 셀의 겹침, 카메라 이동, 줌도 방해되지 않습니다(대상이 <strong>서버</strong> 시야 범위 안에 남아 있기만 하면 됩니다).</li><li><strong>오작동 없는 즉각 반응:</strong> 고정된 플레이어가 분열했다는 서버 패킷을 받는 즉시 반응합니다. 본인이 죽거나, 대상이 죽거나, 매치가 초기화되면 락이 자동으로 풀립니다. 안정적인 작동을 위해 좋은 핑과 FPS는 여전히 필요합니다.</li></ol><p><strong>Pixi (예비 시각 방식)</strong> – 화면의 이미지를 읽어들이는 기존 방식입니다. 게임 업데이트로 WebSocket 읽기가 일시적으로 막혔을 때를 대비해 유지됩니다. 조건이 조금 더 까다로우며, 꾸준히 좋은 FPS와 핑 외에도 다음이 필요합니다:</p><ol><li>대상이 다른 셀이나 화면 가장자리에 가리지 않고 완전히 보여야 합니다.</li><li>오작동을 막으려면 게임 설정에서 스킨, 매스, 적 닉네임을 <strong class='auto-rev-glow'>반드시</strong> 꺼야 합니다.</li><li>락 중에는 카메라를 고정하고 줌을 하지 마세요.</li><li>약 ~10ms의 지연이 있지만 게임 내부 코드에 의존하지 않아 어떤 업데이트 이후에도 계속 작동합니다.</li></ol><p><strong>참고:</strong> 게임 자체 물리상 시간 안에 목표까지 닿지 못하므로 2회 분열(4조각 / 2x)을 초과해 설정하는 것은 권장하지 않습니다.</p>",

        soloDesc: "<p>Fitur ini dibuat terutama untuk bermain multibox: satu sel besar dan satu sel kecil. Pada sel besar, arahkan kursor ke arah trick lalu TEKAN (toggle) Freeze Mouse (atau Line + Freeze Mouse). Jangan ditahan, cukup tekan sekali, kalau tidak sel besar akan membelah ke arah lain.</p><p>Setelah itu pindah ke jendela sel kecil dan tekan tombol bind sesuai massa sel kecil saat ini. Contohnya pada massa ~30k tekan tombol 7 (itu default-nya, bisa Anda ubah sendiri) (Trick 128). Sel kecil langsung membelah 7 kali (128 bagian) ke arah kursor. Bersamaan dengan itu, sel besar di latar belakang membelah 5 kali (32 bagian) mengikuti garis beku, menunggu waktu yang ditentukan (Solo Delay - default 800ms), lalu membelah 5 kali lagi (32 bagian).</p><p>Tepat setelah menekan bind, Anda tinggal menahan tombol feed biasa dari gamenya agar berhasil memberi makan untuk Solo Trick. Hasilnya solo-trick bersih tanpa perlu ganti tab secara manual.</p>",

        fastDesc: "<p>Ingin menyalurkan massa secara efektif ke sel lain? Gunakan Fast-Feed. Tekan Freeze Mouse ke arah yang diinginkan lalu tekan bind Fast-Feed. Hanya jendela tempat bind ditekan yang akan membelah.</p><p>Script membelah 5 kali (32 bagian), menunggu waktu yang diatur, lalu membelah 5 kali lagi (32 bagian). P.S. Saat massa besar (~800k), naikkan slider delay ke sekitar 850ms agar pembelahan tidak terpicu terlalu cepat.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Sebelumnya kami mengira game ini terlalu terlindungi, jadi Auto-Rev hanya bekerja lewat analisis gambar layar. Ternyata tidak demikian, dan sekarang tersedia dua metode di menu: <strong>WebSocket</strong> dan <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – bekerja langsung melalui data server:</p><ol><li><strong>Tidak bereaksi pada Anda maupun rekan setim:</strong> saat mengunci target, script menyaring sel Anda sendiri dan anggota party Anda. Anda tidak akan mengunci diri sendiri atau teman setim, meskipun teman setim menutupi musuh di bawah kursor.</li><li><strong>Tidak perlu ubah pengaturan:</strong> berjalan lancar meski skin, tampilan massa, dan nama musuh aktif. Tertutup sel lain, pergerakan kamera, dan zoom tidak mengganggunya (yang penting target tetap berada dalam jangkauan pandang <strong>SERVER</strong>).</li><li><strong>Reaksi instan tanpa pemicu palsu:</strong> langsung aktif tepat saat paket dari server masuk bahwa pemain yang dikunci membelah diri. Jika Anda mati, target mati, atau match di-reset, kunci otomatis dilepas. Untuk performa stabil, ping dan FPS yang baik tetap diperlukan.</li></ol><p><strong>Pixi (metode visual cadangan)</strong> – cara lama yang membaca gambar dari layar. Berguna jika suatu saat update game merusak pembacaan WebSocket untuk sementara. Di sini syaratnya sedikit lebih ketat – butuh FPS dan ping yang stabil bagus, serta:</p><ol><li>Target harus terlihat penuh: tidak tertutup sel lain atau tepi layar.</li><li>Anda <strong class='auto-rev-glow'>WAJIB</strong> mematikan skin, massa, dan nama musuh di pengaturan game, jika tidak akan terjadi pemicu palsu.</li><li>Kamera harus diam, jangan zoom saat sedang lock.</li><li>Metode ini memiliki jeda ~10ms, tetapi tidak bergantung pada kode internal game dan akan tetap bekerja setelah update apa pun.</li></ol><p><strong>Catatan:</strong> Tidak disarankan memasang lebih dari dua split (4 bagian / 2x), karena berdasarkan fisika gamenya sendiri Anda memang tidak akan sempat sampai ke target.</p>",

      vi: {
        alert: "Script này sẽ không hoạt động trên bất kỳ trình duyệt Nga nào.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Tính năng này chủ yếu dành cho việc chơi multibox: một bóng lớn và một bóng nhỏ. Ở bóng lớn, hãy đưa con trỏ về hướng trick và NHẤN (toggle) Freeze Mouse (hoặc Line + Freeze Mouse). Đừng nhấn giữ mà chỉ bấm một lần, nếu không bóng lớn sẽ tách sang hướng khác.</p><p>Sau đó chuyển sang cửa sổ bóng nhỏ và bấm phím bind phù hợp với khối lượng hiện tại của bóng nhỏ. Ví dụ ở mức ~30k hãy bấm phím 7 (mặc định là phím này, bạn có thể đổi lại) (Trick 128). Bóng nhỏ sẽ tách ngay 7 lần (128 mảnh) về phía con trỏ. Đồng thời, bóng lớn ở tab nền sẽ thực hiện 5 lần tách (32 mảnh) theo đường đã khóa, chờ đúng thời gian đã đặt (Solo Delay - mặc định 800ms) rồi tách thêm 5 lần (32 mảnh).</p><p>Ngay sau khi bấm bind, bạn chỉ cần giữ phím nhả khối lượng thông thường của game để bơm đủ cho Solo Trick. Điều này tạo ra cú solo-trick gọn gàng mà không phải chuyển tab thủ công.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Muốn dồn khối lượng hiệu quả sang một bóng khác? Hãy dùng Fast-Feed. Nhấn Freeze Mouse theo hướng mong muốn rồi bấm bind Fast-Feed. Chỉ cửa sổ nơi bạn bấm bind mới thực hiện tách.</p><p>Script tách 5 lần (32 mảnh), chờ theo thời gian đã đặt rồi tách tiếp 5 lần (32 mảnh). P.S. Khi khối lượng lớn (~800k), hãy tăng thanh độ trễ lên khoảng 850ms để bóng không tách quá sớm.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Trước đây chúng tôi nghĩ game được bảo vệ quá chặt nên Auto-Rev chỉ hoạt động qua việc phân tích hình ảnh màn hình. Nhưng hóa ra không phải vậy, và hiện trong menu có hai phương thức hoạt động: <strong>WebSocket</strong> và <strong>Pixi</strong>.</p><p><strong>WebSocket</strong> – hoạt động trực tiếp qua dữ liệu máy chủ:</p><ol><li><strong>Không phản ứng với bạn và đồng đội:</strong> khi khóa mục tiêu, script sẽ lọc bỏ các bóng của bạn và thành viên trong party. Bạn sẽ không khóa nhầm bản thân hay đồng đội, ngay cả khi đồng đội đang đè lên kẻ địch dưới con trỏ.</li><li><strong>Không cần đổi cài đặt:</strong> chạy mượt ngay cả khi bật skin, hiển thị khối lượng và tên địch. Bị bóng khác che, di chuyển camera hay zoom đều không làm ảnh hưởng (miễn là mục tiêu vẫn nằm trong tầm nhìn của <strong>MÁY CHỦ</strong>).</li><li><strong>Phản ứng tức thì, không kích hoạt nhầm:</strong> kích hoạt ngay khoảnh khắc nhận gói tin từ máy chủ báo người chơi bị khóa vừa tách. Khi bạn chết, mục tiêu chết hoặc trận đấu đặt lại, khóa sẽ tự động hủy. Để chạy ổn định vẫn cần ping và FPS tốt.</li></ol><p><strong>Pixi (cách trực quan dự phòng)</strong> – cách cũ đọc hình ảnh từ màn hình. Dùng trong trường hợp bản cập nhật game nào đó tạm thời làm hỏng việc đọc WebSocket. Ở đây điều kiện chặt hơn một chút – cần FPS và ping ổn định, đồng thời:</p><ol><li>Mục tiêu phải hiển thị đầy đủ: không bị bóng khác hay mép màn hình che khuất.</li><li>Bạn <strong class='auto-rev-glow'>BẮT BUỘC</strong> phải tắt skin, khối lượng và tên địch trong cài đặt game, nếu không sẽ bị kích hoạt nhầm.</li><li>Camera phải đứng yên, không zoom khi đang khóa.</li><li>Phương thức này có độ trễ ~10ms nhưng không phụ thuộc vào mã nội bộ của game nên sẽ tiếp tục hoạt động sau mọi bản cập nhật.</li></ol><p><strong>Lưu ý:</strong> Không khuyến nghị đặt quá hai lần tách (4 mảnh / 2x), vì theo vật lý của chính game thì bạn đơn giản là không kịp bay tới mục tiêu.</p>",
        noVideo: "Video không khả dụng",

      th: {
        alert: "สคริปต์นี้จะไม่ทำงานบนเบราว์เซอร์รัสเซียใด ๆ",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>ฟีเจอร์นี้ทำมาเพื่อการเล่นมัลติบ็อกซ์เป็นหลัก: ลูกใหญ่ 1 ลูกและลูกเล็ก 1 ลูก ในฝั่งลูกใหญ่ให้เลื่อนเคอร์เซอร์ไปทางที่จะทำทริคแล้วกด (toggle) Freeze Mouse (หรือ Line + Freeze Mouse) อย่ากดค้าง ให้กดครั้งเดียว ไม่อย่างนั้นลูกใหญ่จะแตกตัวไปทางอื่น</p><p>จากนั้นสลับไปหน้าต่างที่มีลูกเล็กแล้วกดปุ่มที่ตั้งไว้ให้เหมาะกับมวลปัจจุบันของลูกเล็ก เช่น ที่มวล ~30k ให้กดปุ่ม 7 (ค่าเริ่มต้นคือปุ่มนี้ คุณเปลี่ยนปุ่มเองได้) (Trick 128) ลูกเล็กจะแตกตัวทันที 7 ครั้ง (128 ชิ้น) ไปทางเคอร์เซอร์ พร้อมกันนั้นลูกใหญ่ในพื้นหลังจะแตกตัว 5 ครั้ง (32 ชิ้น) ตามแนวที่ล็อกไว้ รอตามเวลาที่ตั้ง (Solo Delay - ค่าเริ่มต้น 800ms) แล้วแตกตัวอีก 5 ครั้ง (32 ชิ้น)</p><p>หลังกดปุ่มแล้ว คุณแค่กดปุ่มป้อนมวลปกติในเกมค้างไว้เพื่อป้อนให้สำเร็จสำหรับ Solo Trick ทำให้ได้โซโล่ทริคแบบเนียนๆ โดยไม่ต้องสลับแท็บเอง</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>อยากส่งมวลเข้าอีกลูกอย่างมีประสิทธิภาพใช่ไหม? ใช้ Fast-Feed เลย กด Freeze Mouse ไปทิศทางที่ต้องการแล้วกดปุ่ม Fast-Feed เฉพาะหน้าต่างที่กดปุ่มเท่านั้นที่จะแตกตัว</p><p>สคริปต์จะแตกตัว 5 ครั้ง (32 ชิ้น) รอตามเวลาที่ตั้งไว้ แล้วแตกตัวอีก 5 ครั้ง (32 ชิ้น) หมายเหตุ: เมื่อมวลเยอะ (~800k) ให้เพิ่มตัวเลื่อนดีเลย์ไปประมาณ 850ms เพื่อไม่ให้การแตกตัวทำงานเร็วเกินไป</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>ก่อนหน้านี้เราคิดว่าเกมป้องกันแน่นหนาเกินไป Auto-Rev เลยทำงานผ่านการวิเคราะห์ภาพหน้าจอเท่านั้น แต่ปรากฏว่าไม่ใช่แบบนั้น และตอนนี้ในเมนูมีให้เลือก 2 วิธีคือ <strong>WebSocket</strong> และ <strong>Pixi</strong></p><p><strong>WebSocket</strong> – ทำงานผ่านข้อมูลเซิร์ฟเวอร์โดยตรง:</p><ol><li><strong>ไม่ตอบสนองต่อคุณและเพื่อนร่วมทีม:</strong> ตอนล็อกเป้าหมาย สคริปต์จะคัดลูกของคุณและคนในปาร์ตี้ออก คุณจะไม่ล็อกตัวเองหรือเพื่อนร่วมทีม แม้เพื่อนจะบังศัตรูอยู่ใต้เคอร์เซอร์ก็ตาม</li><li><strong>ไม่ต้องเปลี่ยนการตั้งค่า:</strong> ใช้งานได้ปกติแม้จะเปิดสกิน แสดงมวล และชื่อศัตรูไว้ ลูกอื่นบัง การขยับกล้อง หรือการซูมก็ไม่รบกวน (ขอแค่เป้าหมายยังอยู่ในระยะการมองเห็นของ <strong>เซิร์ฟเวอร์</strong>)</li><li><strong>ตอบสนองทันทีโดยไม่ลั่นมั่ว:</strong> ทำงานทันทีในจังหวะที่ได้รับแพ็กเก็ตจากเซิร์ฟเวอร์ว่าผู้เล่นที่ล็อกไว้แตกตัวแล้ว เมื่อคุณตาย เป้าหมายตาย หรือรีเซ็ตแมตช์ ระบบจะปลดล็อกให้อัตโนมัติ ทั้งนี้ยังต้องอาศัย Ping และ FPS ที่ดีเพื่อความเสถียร</li></ol><p><strong>Pixi (วิธีสำรองแบบอ่านภาพ)</strong> – วิธีแบบเดิมที่อ่านภาพจากหน้าจอ มีไว้เผื่อกรณีที่อัปเดตเกมทำให้การอ่าน WebSocket เสียชั่วคราว เงื่อนไขจะเข้มงวดกว่านิดหน่อย ต้องมี FPS และ Ping ที่ดีสม่ำเสมอ รวมถึง:</p><ol><li>เป้าหมายต้องมองเห็นได้เต็มวง ไม่ถูกลูกอื่นหรือขอบจอบัง</li><li>คุณ<strong class='auto-rev-glow'>ต้อง</strong>ปิดสกิน มวล และชื่อศัตรูในการตั้งค่าเกม มิฉะนั้นจะเกิดการทำงานผิดพลาด</li><li>กล้องต้องนิ่ง ห้ามซูมระหว่างล็อกเป้า</li><li>วิธีนี้มีดีเลย์ ~10ms แต่ไม่อิงกับโค้ดภายในของเกม จึงทำงานต่อได้หลังอัปเดตทุกครั้ง</li></ol><p><strong>หมายเหตุ:</strong> ไม่แนะนำให้ตั้งเกิน 2 สปลิต (4 ชิ้น / 2x) เพราะตามฟิสิกส์ของตัวเกมเอง คุณจะพุ่งไปถึงเป้าหมายไม่ทัน</p>",
