<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#d0d0d0;font-family:'Ubuntu',Arial,sans-serif;min-height:100vh;line-height:1.58;font-size:14px}
header{position:sticky;top:0;z-index:50;background:#121212;border-bottom:1px solid #242424}
.top-bar{max-width:1160px;margin:0 auto;padding:11px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.logo-main{font-size:17px;font-weight:700;color:#efefef;letter-spacing:0.2px}
.logo-main span{color:#3898ec}
.logo-ver{font-size:12px;color:#777;font-weight:500}
.lang-select{background:#191919;border:1px solid #303030;color:#e4e4e4;font-family:inherit;font-size:13px;font-weight:500;padding:6px 10px;border-radius:4px;outline:none;cursor:pointer;max-width:210px}
.lang-select:hover,.lang-select:focus{border-color:#505050}
.lang-select option{background:#161616;color:#e4e4e4}
main{max-width:1160px;margin:0 auto;padding:20px 20px 56px}
.notice{background:#181212;border:1px solid #2d1d1d;border-inline-start:3px solid #d13838;color:#c9b4b4;font-size:13.5px;padding:11px 15px;border-radius:4px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.notice b{color:#ff6b6b}
.notice-text{flex:1 1 260px;min-width:0}
.notice-link{display:inline-flex;align-items:center;gap:7px;background:#131c26;border:1px solid #233b54;color:#3898ec;font-size:13px;font-weight:700;line-height:1.25;padding:5px 11px;border-radius:4px;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:background 0.15s,border-color 0.15s,color 0.15s}
.notice-link:hover,.notice-link:focus-visible{background:#192736;border-color:#3898ec;color:#62b2f5;outline:none}
.notice-link svg{width:14px;height:14px;fill:currentColor;flex-shrink:0;display:block}
.list{display:flex;flex-direction:column;gap:14px}
.item{background:#141414;border:1px solid #242424;border-radius:5px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) 450px;gap:22px;align-items:start}
.item-head{font-size:16px;font-weight:700;color:#fff;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid #222}
.item-body{font-size:13.5px;color:#c8c8c8;overflow-wrap:break-word}
.item-body p{margin-bottom:10px}
.item-body p:last-child{margin-bottom:0}
.item-body strong{color:#fff}
.media-wrap{width:100%;aspect-ratio:16/9;background:#070707;border:1px solid #262626;border-radius:4px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.media-wrap video{width:100%;height:100%;object-fit:contain;outline:none;display:block}
.vid-empty{display:none;color:#666;font-size:12.5px;text-align:center;padding:14px;user-select:none}
@media(max-width:940px){
  .item{grid-template-columns:1fr;gap:16px;padding:16px}
}

  const d4PxN = {
      en: {
        alert: "This script will not work in any Russian browser.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>This feature is made mainly for multiboxing with one big cell and one small cell. On the big cell, point your cursor toward the trick direction and PRESS (toggle) Freeze Mouse (or Line + Freeze Mouse). Do not hold it down, just press it, otherwise the big cell will split the other way.</p><p>Then switch to the small cell window and press the bind that fits the small cell's current mass. For example, at ~30k mass press key 7 (it is set by default, you can rebind it) (Trick 128). The small cell will instantly split 7 times (into 128 pieces) toward your cursor. At the same time, the big cell in the background will do 5 splits (32 pieces) along the frozen line, wait for the set time (Solo Delay - 800ms by default), and split another 5 times (32 pieces).</p><p>Right after pressing the bind, all you have to do is hold your normal in-game feed key so you successfully feed up for the Solo Trick. This gives you a clean solo-trick without switching tabs manually.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Want to efficiently dump mass into another cell? Use Fast-Feed. Press Freeze Mouse in the needed direction and press the Fast-Feed bind. Only the window where the bind was pressed will split.</p><p>The script does 5 splits (32 pieces), waits for the set time, and does another 5 splits (32 pieces). P.S. At heavy mass (~800k), raise the delay slider to around 850ms so the split does not trigger too early.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Yes, Auto-Rev is not implemented in the best way, but we had no other choice because the game is too protected. For the feature to work consistently, you need consistently good FPS and ping, and also:</p><p>The target cell must be fully visible and not covered by other cells or screen edges. You <strong>MUST</strong> turn off mass display, skins, and enemy nicknames in the game settings, otherwise there will be false triggers. Your camera must stay still, do not zoom while locked.</p><p>Notes: There is a ~10ms delay, but thanks to the clever implementation of the Auto-Rev mechanic, it will not break in future game updates; it is not recommended to set more than two splits (4 pieces), because you simply will not make it to the target in time.</p>",
        noVideo: "Video unavailable",
        codeLink: "Latest code"
      },
      ru: {
        alert: "Этот скрипт не будет работать ни в одном российском браузере.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Функция сделана в основном для игры с мультом: один большой и мелкий шары. На большом шаре наведите курсор в сторону трика и НАЖМИТЕ (toggle) Freeze Mouse (или Line + Freeze Mouse). Не зажать, а именно нажать, иначе большой шар разделится в другую сторону.</p><p>Затем перейдите в окно, где мелкий шар, нажмите бинд под текущую массу мелкого шара. Например, при массе ~30k жмите клавишу 7 (по умолчанию стоит она, можете перебиндить) (Trick 128). Мелкий шар мгновенно разделится 7 раз (на 128 частей) в сторону курсора. Одновременно большой шар в фоне сделает 5 сплитов (32 части) по замороженной линии, подождет заданное время (Solo Delay - по умолчанию 800ms) и разделится еще 5 раз (32 части).</p><p>Сразу после нажатия бинда вам остается только зажать обычную клавишу кормления из самой игры, чтобы вы успешно откормились для Solo Trick'а. Это дает чистый соло-трик без ручного переключения вкладок.</p>",

        fastDesc: "<p>Хотите эффективно влить массу в другой шар? Используйте Fast-Feed. Нажмите Freeze Mouse в нужном направлении и нажмите бинд Fast-Feed'а. Делится только то окно, с которого нажат бинд.</p><p>Скрипт делает 5 сплитов (32 части), ждет заданное время и делает еще 5 сплитов (32 части). P.S. При большой массе (~800k) увеличьте ползунок задержки примерно до 850ms, чтобы деление не сработало слишком рано.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Да, авто-рев реализован не самым лучшим образом, но другого выбора у нас не было, игра слишком защищена. Чтобы функция работала стабильно, нужно иметь стабильно хорошие FPS и пинг, а также:</p><p>Шар цели должен быть полностью виден, не закрыт другими шарами или краями экрана. Вы <strong>ОБЯЗАНЫ</strong> выключить показ массы, скины и ники врагов в настройках игры, иначе будут ложные срабатывания. Камера должна быть неподвижной, не зумите во время лока.</p><p>Примечания: Есть задержка в ~10ms, но благодаря интересной реализации механики авто-рева, он не сломается при будущих обновлениях игры; больше двух сплитов (4 части) ставить не рекомендовано, так как вы тупо не успеете долететь до цели.</p>",
        noVideo: "Видео недоступно",
        codeLink: "Актуальный код"

      uk: {
        alert: "Цей скрипт не працюватиме в жодному російському браузері.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Функція зроблена здебільшого для гри з мультом: одна велика й одна дрібна кулі. На великій кулі наведіть курсор у бік трюку і НАТИСНІТЬ (toggle) Freeze Mouse (або Line + Freeze Mouse). Не затиснути, а саме натиснути, інакше велика куля розділиться в інший бік.</p><p>Потім перейдіть у вікно з дрібною кулею і натисніть бінд під її поточну масу. Наприклад, при масі ~30k тисніть клавішу 7 (вона стоїть за замовчуванням, можете перебіндити) (Trick 128). Дрібна куля миттєво розділиться 7 разів (на 128 частин) у бік курсора. Одночасно велика куля у фоні зробить 5 сплітів (32 частини) по замороженій лінії, зачекає заданий час (Solo Delay - за замовчуванням 800ms) і розділиться ще 5 разів (32 частини).</p><p>Одразу після натискання бінда вам залишається лише затиснути звичайну клавішу годування з самої гри, щоб ви успішно відгодувалися для Solo Trick'а. Це дає чистий соло-трюк без ручного перемикання вкладок.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Хочете ефективно влити масу в іншу кулю? Використовуйте Fast-Feed. Натисніть Freeze Mouse у потрібному напрямку та натисніть бінд Fast-Feed'а. Ділиться лише те вікно, з якого натиснуто бінд.</p><p>Скрипт робить 5 сплітів (32 частини), чекає заданий час і робить ще 5 сплітів (32 частини). P.S. При великій масі (~800k) збільште повзунок затримки приблизно до 850ms, щоб поділ не спрацював занадто рано.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Так, авто-рев реалізовано не найкращим чином, але іншого вибору в нас не було — гра занадто захищена. Щоб функція працювала стабільно, потрібно мати стабільно хороші FPS і пінг, а також:</p><p>Куля цілі має бути повністю видимою, не закритою іншими кулями чи краями екрана. Ви <strong>ЗОБОВ'ЯЗАНІ</strong> вимкнути показ маси, скіни та ніки ворогів у налаштуваннях гри, інакше будуть хибні спрацьовування. Камера повинна бути нерухомою, не зуміть під час локу.</p><p>Примітки: Є затримка ~10ms, але завдяки цікавій реалізації механіки авто-рева він не зламається під час майбутніх оновлень гри; більше двох сплітів (4 частини) ставити не рекомендовано, бо ви тупо не встигнете долетіти до цілі.</p>",
        noVideo: "Відео недоступне",
        codeLink: "Актуальний код"
      },
      es: {
        alert: "Este script no funcionará en ningún navegador ruso.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Esta función está hecha principalmente para jugar con multibox: una célula grande y una pequeña. En la célula grande, apunta el cursor hacia el lado del truco y PULSA (toggle) Freeze Mouse (o Line + Freeze Mouse). No lo mantengas pulsado, solo púlsalo, o la célula grande se dividirá hacia otro lado.</p><p>Luego pasa a la ventana de la célula pequeña y pulsa el bind según su masa actual. Por ejemplo, con ~30k de masa pulsa la tecla 7 (viene por defecto, puedes cambiarla) (Trick 128). La pequeña se dividirá 7 veces al instante (128 partes) hacia el cursor. Al mismo tiempo, la grande en segundo plano hará 5 splits (32 partes) por la línea congelada, esperará el tiempo configurado (Solo Delay - 800ms por defecto) y volverá a dividirse 5 veces (32 partes).</p><p>Justo después de pulsar el bind, solo tienes que mantener tu tecla normal de feed del juego para alimentarte bien para el Solo Trick. Esto da un solo-trick limpio sin cambiar de pestaña manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>¿Quieres pasar masa de forma eficiente a otra célula? Usa Fast-Feed. Pulsa Freeze Mouse en la dirección deseada y pulsa el bind de Fast-Feed. Solo se divide la ventana desde la que pulsaste el bind.</p><p>El script hace 5 splits (32 partes), espera el tiempo indicado y hace otros 5 splits (32 partes). P.D. Con masa alta (~800k), sube el deslizador de retraso a unos 850ms para que no se active demasiado pronto.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Sí, Auto-Rev no está hecho de la mejor manera, pero no teníamos otra opción porque el juego está muy protegido. Para que funcione de forma estable necesitas FPS estables y buen ping, y además:</p><p>La célula objetivo debe verse por completo y no quedar tapada por otras células o por los bordes de la pantalla. Estás <strong>OBLIGADO</strong> a desactivar la masa, skins y nombres enemigos en los ajustes del juego, o habrá falsos disparos. Mantén la cámara inmóvil y no hagas zoom durante el bloqueo.</p><p>Notas: Hay un retraso de ~10ms, pero gracias a cómo está hecha la mecánica de Auto-Rev no se romperá en futuras actualizaciones del juego; no se recomienda poner más de dos splits (4 partes), ya que simplemente no llegarás a tiempo al objetivo.</p>",
        noVideo: "Video no disponible",
        codeLink: "Código actual"

      pt: {
        alert: "Este script não funcionará em nenhum navegador russo.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Esta função foi feita principalmente para jogar de multibox: uma célula grande e uma pequena. Na célula grande, aponte o cursor para o lado do trick e APERTE (toggle) Freeze Mouse (ou Line + Freeze Mouse). Não segure, apenas aperte, senão a célula grande vai se dividir para o outro lado.</p><p>Depois vá para a janela da célula pequena e aperte o bind correspondente à massa atual dela. Por exemplo, com ~30k de massa aperte a tecla 7 (já vem por padrão, você pode rebindar) (Trick 128). A pequena vai dividir 7 vezes na hora (128 pedaços) na direção do cursor. Ao mesmo tempo, a grande em segundo plano fará 5 splits (32 pedaços) na linha congelada, aguardará o tempo definido (Solo Delay - 800ms por padrão) e dividirá mais 5 vezes (32 pedaços).</p><p>Logo após apertar o bind, basta segurar sua tecla normal de feed do jogo para se alimentar bem para o Solo Trick. Isso garante um solo-trick limpo sem trocar de abas manualmente.</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>Quer passar massa de forma eficiente para outra célula? Use o Fast-Feed. Aperte Freeze Mouse na direção desejada e aperte o bind do Fast-Feed. Apenas a janela de onde o bind foi pressionado será dividida.</p><p>O script faz 5 splits (32 pedaços), aguarda o tempo definido e faz mais 5 splits (32 pedaços). P.S. Com massa alta (~800k), aumente o controle de atraso para cerca de 850ms para a divisão não disparar cedo demais.</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>Sim, o Auto-Rev não foi implementado da melhor forma, mas não tínhamos escolha porque o jogo é muito protegido. Para funcionar de forma estável, você precisa de FPS e ping consistentemente bons, e também:</p><p>A célula alvo deve estar totalmente visível, sem ser coberta por outras células ou pelas bordas da tela. Você é <strong>OBRIGADO</strong> a desativar exibição de massa, skins e nicks inimigos nas configurações do jogo, caso contrário haverá ativações falsas. Mantenha a câmera parada e não dê zoom durante o lock.</p><p>Notas: Há um atraso de ~10ms, mas graças à forma inteligente como a mecânica foi feita, ele não vai quebrar nas próximas atualizações do jogo; não é recomendado colocar mais de dois splits (4 pedaços), pois você simplesmente não chegará a tempo no alvo.</p>",

        codeLink: "Código atual"
      },
      fr: {
        alert: "Ce script ne fonctionnera dans aucun navigateur russe.",
        soloTitle: "Solo-Trick",
        soloDesc: "<p>Cette fonction est surtout conçue pour le jeu en multibox : une grande cellule et une petite. Sur la grande cellule, pointez le curseur vers la direction du trick et APPUYEZ (toggle) sur Freeze Mouse (ou Line + Freeze Mouse). Ne maintenez pas la touche, appuyez juste dessus, sinon la grande cellule se divisera dans une autre direction.</p><p>Passez ensuite sur la fenêtre de la petite cellule et appuyez sur le bind adapté à sa masse actuelle. Par exemple, vers ~30k de masse, appuyez sur la touche 7 (par défaut, vous pouvez la rebind) (Trick 128). La petite cellule se divisera instantanément 7 fois (128 parts) vers le curseur. En même temps, la grande cellule en arrière-plan fera 5 splits (32 parts) sur la ligne gelée, attendra le délai réglé (Solo Delay - 800ms par défaut) puis se divisera encore 5 fois (32 parts).</p><p>Juste après avoir appuyé sur le bind, il ne vous reste qu'à maintenir votre touche normale de feed du jeu pour bien alimenter le Solo Trick. Cela donne un solo-trick propre sans changer d'onglet à la main.</p>",
        fastTitle: "Fast-Feed",

        soloDesc: "<p>ฟีเจอร์นี้ทำมาเพื่อการเล่นมัลติบ็อกซ์เป็นหลัก: ลูกใหญ่ 1 ลูกและลูกเล็ก 1 ลูก ในฝั่งลูกใหญ่ให้เลื่อนเคอร์เซอร์ไปทางที่จะทำทริคแล้วกด (toggle) Freeze Mouse (หรือ Line + Freeze Mouse) อย่ากดค้าง ให้กดครั้งเดียว ไม่อย่างนั้นลูกใหญ่จะแตกตัวไปทางอื่น</p><p>จากนั้นสลับไปหน้าต่างที่มีลูกเล็กแล้วกดปุ่มที่ตั้งไว้ให้เหมาะกับมวลปัจจุบันของลูกเล็ก เช่น ที่มวล ~30k ให้กดปุ่ม 7 (ค่าเริ่มต้นคือปุ่มนี้ คุณเปลี่ยนปุ่มเองได้) (Trick 128) ลูกเล็กจะแตกตัวทันที 7 ครั้ง (128 ชิ้น) ไปทางเคอร์เซอร์ พร้อมกันนั้นลูกใหญ่ในพื้นหลังจะแตกตัว 5 ครั้ง (32 ชิ้น) ตามแนวที่ล็อกไว้ รอตามเวลาที่ตั้ง (Solo Delay - ค่าเริ่มต้น 800ms) แล้วแตกตัวอีก 5 ครั้ง (32 ชิ้น)</p><p>หลังกดปุ่มแล้ว คุณแค่กดปุ่มป้อนมวลปกติในเกมค้างไว้เพื่อป้อนให้สำเร็จสำหรับ Solo Trick ทำให้ได้โซโล่ทริคแบบเนียนๆ โดยไม่ต้องสลับแท็บเอง</p>",
        fastTitle: "Fast-Feed",
        fastDesc: "<p>อยากส่งมวลเข้าอีกลูกอย่างมีประสิทธิภาพใช่ไหม? ใช้ Fast-Feed เลย กด Freeze Mouse ไปทิศทางที่ต้องการแล้วกดปุ่ม Fast-Feed เฉพาะหน้าต่างที่กดปุ่มเท่านั้นที่จะแตกตัว</p><p>สคริปต์จะแตกตัว 5 ครั้ง (32 ชิ้น) รอตามเวลาที่ตั้งไว้ แล้วแตกตัวอีก 5 ครั้ง (32 ชิ้น) หมายเหตุ: เมื่อมวลเยอะ (~800k) ให้เพิ่มตัวเลื่อนดีเลย์ไปประมาณ 850ms เพื่อไม่ให้การแตกตัวทำงานเร็วเกินไป</p>",
        autoTitle: "Auto-Rev",
        autoDesc: "<p>ใช่ Auto-Rev ยังไม่ได้ถูกทำด้วยวิธีที่ดีที่สุด แต่เราไม่มีทางเลือกอื่นเพราะเกมป้องกันแน่นหนาเกินไป เพื่อให้ฟีเจอร์นี้ทำงานเสถียร คุณต้องมี FPS และ Ping ที่ดีอย่างสม่ำเสมอ รวมถึง:</p><p>ลูกเป้าหมายต้องมองเห็นได้เต็มวง ไม่ถูกบังด้วยลูกอื่นหรือขอบจอ คุณ<strong>ต้อง</strong>ปิดการแสดงมวล สกิน และชื่อศัตรูในการตั้งค่าเกม มิฉะนั้นจะเกิดการทำงานผิดพลาด กล้องต้องนิ่ง ห้ามซูมระหว่างล็อกเป้า</p><p>หมายเหตุ: มีดีเลย์ราว ~10ms แต่ด้วยรูปแบบการทำงานที่น่าสนใจของกลไก Auto-Rev มันจะไม่พังเมื่อเกมอัปเดตในอนาคต ไม่แนะนำให้ตั้งเกิน 2 สปลิต (4 ชิ้น) เพราะคุณจะพุ่งไปถึงเป้าหมายไม่ทัน</p>",
        noVideo: "ไม่มีวิดีโอ",
        codeLink: "โค้ดล่าสุด"
      }
  };

  const s2VnK = k8LmQ.getElementById("lang-select");
  const a7RmT = k8LmQ.getElementById("alert-box");
  const q1WxP = k8LmQ.getElementById("t-solo-title");
  const w3ZnL = k8LmQ.getElementById("t-solo-desc");
  const e5KpM = k8LmQ.getElementById("t-fast-title");
  const r9TvB = k8LmQ.getElementById("t-fast-desc");
  const t2YxC = k8LmQ.getElementById("t-auto-title");
  const y4HuN = k8LmQ.getElementById("t-auto-desc");
  const m6QcL = k8LmQ.getElementById("t-code-link");
  const v8JsM = Object.keys(d4PxN);

  function c6FgW(lang) {
    const code = v8JsM.indexOf(lang) !== -1 ? lang : "en";
    const d = d4PxN[code];
    k8LmQ.documentElement.lang = code;
    k8LmQ.documentElement.dir = code === "ar" ? "rtl" : "ltr";
    a7RmT.innerHTML = d.alert;
    q1WxP.textContent = d.soloTitle;
    w3ZnL.innerHTML = d.soloDesc;
    e5KpM.textContent = d.fastTitle;
    r9TvB.innerHTML = d.fastDesc;
    t2YxC.textContent = d.autoTitle;
    y4HuN.innerHTML = d.autoDesc;
    if (m6QcL) m6QcL.textContent = d.codeLink;
    s2VnK.value = code;
    k8LmQ.querySelectorAll(".vid-empty").forEach(el => {
      el.textContent = d.noVideo + " (" + el.getAttribute("data-file") + ")";
    });
  }

  const n3LpQ = ((navigator.languages && navigator.languages[0]) || navigator.language || "en").toLowerCase().slice(0, 2);
  let p7XrZ = null;
  try { p7XrZ = localStorage.getItem("mbx_user_lang"); } catch (_) {}
  if (!p7XrZ || v8JsM.indexOf(p7XrZ) === -1) {
    p7XrZ = v8JsM.indexOf(n3LpQ) !== -1 ? n3LpQ : "en";
  }
  c6FgW(p7XrZ);

  s2VnK.addEventListener("change", function () {
    const v = this.value;
    try { localStorage.setItem("mbx_user_lang", v); } catch (_) {}
    c6FgW(v);
  });

  ["solo-video", "fast-feed-video", "auto-rev-video"].forEach(id => {
    const v = k8LmQ.getElementById(id);
    if (!v) return;
    v.addEventListener("error", () => {
      v.style.display = "none";
      const ph = v.parentElement && v.parentElement.querySelector(".vid-empty");
      if (ph) ph.style.display = "block";
    });
  });
})(document);
</script>
</body>
</html>
